  // ==========================================
  // MODULE: weather.js
  // ==========================================
/**
 * Indian Tractor Simulator 3D - Dynamic Weather & Day-Night System
 * Controls sun/moon positions, atmospheric sky colors, dynamic fog,
 * rain streak particle system, and environmental illumination.
 */

class WeatherSystem {
  constructor(scene, THREE) {
    this.scene = scene;
    this.THREE = THREE;

    this.currentWeather = 'sunny'; // 'sunny', 'cloudy', 'rainy', 'foggy'
    this.currentTimeOfDay = 'morning'; // 'morning', 'afternoon', 'evening', 'night'

    // Directional Sun / Moon light
    this.sunLight = new THREE.DirectionalLight(0xfff3e0, 1.4);
    this.sunLight.castShadow = true;
    this.sunLight.shadow.mapSize.width = 2048;
    this.sunLight.shadow.mapSize.height = 2048;
    this.sunLight.shadow.camera.near = 1.0;
    this.sunLight.shadow.camera.far = 400;
    const d = 140;
    this.sunLight.shadow.camera.left = -d;
    this.sunLight.shadow.camera.right = d;
    this.sunLight.shadow.camera.top = d;
    this.sunLight.shadow.camera.bottom = -d;
    this.sunLight.shadow.bias = -0.0005;

    this.scene.add(this.sunLight);

    // Ambient light
    this.ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
    this.scene.add(this.ambientLight);

    // Hemispherical sky/ground light
    this.hemiLight = new THREE.HemisphereLight(0x90caf9, 0x4e342e, 0.4);
    this.scene.add(this.hemiLight);

    // Rain Particle System
    this.rainParticles = null;
    this.rainCount = 1800;
    this.rainGeometry = null;
    this.rainMaterial = null;

    this.initRain();
    this.applyEnvironment();
  }

  initRain() {
    const THREE = this.THREE;
    this.rainGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(this.rainCount * 3);

    for (let i = 0; i < this.rainCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 90;
      positions[i * 3 + 1] = Math.random() * 45;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 90;
    }

    this.rainGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    this.rainMaterial = new THREE.PointsMaterial({
      color: 0xbbdefb,
      size: 0.28,
      transparent: true,
      opacity: 0.75
    });

    this.rainParticles = new THREE.Points(this.rainGeometry, this.rainMaterial);
    this.rainParticles.visible = false;
    this.scene.add(this.rainParticles);
  }

  setWeather(weather, audioManager = null) {
    this.currentWeather = weather;
    if (audioManager) {
      audioManager.setRainSound(weather === 'rainy');
    }
    this.applyEnvironment();
  }

  setTimeOfDay(timeOfDay) {
    this.currentTimeOfDay = timeOfDay;
    this.applyEnvironment();
  }

  applyEnvironment() {
    const THREE = this.THREE;

    // Default daylight color profiles
    let skyColor = 0x87ceeb;
    let sunColor = 0xfff3e0;
    let sunIntensity = 1.35;
    let ambientIntensity = 0.45;
    let sunPos = new THREE.Vector3(70, 110, 50);
    let fogColor = 0xddeeff;
    let fogNear = 80;
    let fogFar = 320;

    // Day-Night Lighting Profiles
    switch (this.currentTimeOfDay) {
      case 'morning':
        skyColor = 0xffc482; // Warm Indian dawn
        sunColor = 0xffb74d;
        sunIntensity = 1.1;
        ambientIntensity = 0.5;
        sunPos.set(-120, 45, 60);
        fogColor = 0xffd1a4;
        break;
      case 'afternoon':
        skyColor = 0x4fc3f7; // Crisp high noon
        sunColor = 0xffffff;
        sunIntensity = 1.5;
        ambientIntensity = 0.55;
        sunPos.set(40, 150, 40);
        fogColor = 0xb3e5fc;
        break;
      case 'evening':
        skyColor = 0xe65100; // Rich golden sunset
        sunColor = 0xff7043;
        sunIntensity = 1.0;
        ambientIntensity = 0.4;
        sunPos.set(130, 30, -50);
        fogColor = 0xffab91;
        break;
      case 'night':
        skyColor = 0x050b14; // Deep village midnight
        sunColor = 0x5c6bc0; // Moonlight
        sunIntensity = 0.25;
        ambientIntensity = 0.12;
        sunPos.set(-50, 90, -70);
        fogColor = 0x07111e;
        fogNear = 40;
        fogFar = 220;
        break;
    }

    // Weather modifiers
    if (this.currentWeather === 'cloudy') {
      sunIntensity *= 0.65;
      ambientIntensity *= 1.2;
      skyColor = 0x90a4ae;
      fogColor = 0x90a4ae;
    } else if (this.currentWeather === 'rainy') {
      sunIntensity *= 0.35;
      ambientIntensity *= 0.9;
      skyColor = 0x37474f;
      fogColor = 0x37474f;
      fogNear = 30;
      fogFar = 160;
    } else if (this.currentWeather === 'foggy') {
      // Authentic North Indian winter morning fog (Dhund)
      sunIntensity *= 0.4;
      ambientIntensity *= 1.3;
      fogNear = 10;
      fogFar = 75;
      fogColor = 0xeeeeee;
      skyColor = 0xcccccc;
    }

    // Apply to lights
    this.sunLight.color.setHex(sunColor);
    this.sunLight.intensity = sunIntensity;
    this.sunLight.position.copy(sunPos);

    this.ambientLight.intensity = ambientIntensity;
    this.scene.background = new THREE.Color(skyColor);
    this.scene.fog = new THREE.Fog(fogColor, fogNear, fogFar);

    // Rain particles toggle
    if (this.rainParticles) {
      this.rainParticles.visible = (this.currentWeather === 'rainy');
    }
  }

  update(dt, tractorX, tractorZ) {
    // Keep sun shadow frustum centered near tractor
    this.sunLight.target.position.set(tractorX, 0, tractorZ);
    this.sunLight.target.updateMatrixWorld();

    // Animate rain streaks falling and wrapping around tractor
    if (this.currentWeather === 'rainy' && this.rainParticles && this.rainParticles.visible) {
      const positions = this.rainGeometry.attributes.position.array;
      const speed = 48 * dt;

      for (let i = 0; i < this.rainCount; i++) {
        positions[i * 3 + 1] -= speed;

        // Reset if below ground
        if (positions[i * 3 + 1] < 0) {
          positions[i * 3 + 1] = 40 + Math.random() * 5;
          positions[i * 3] = tractorX + (Math.random() - 0.5) * 80;
          positions[i * 3 + 2] = tractorZ + (Math.random() - 0.5) * 80;
        }
      }

      this.rainGeometry.attributes.position.needsUpdate = true;
    }
  }
}

  // MODULE: camera.js
  // ==========================================
/**
 * Indian Tractor Simulator 3D - Camera Controller
 * Supports 5 working camera modes:
 * 1. Third-Person Chase (smooth damping)
 * 2. Close Rear (hitch alignment view)
 * 3. Driver Cab First-Person (cockpit & hood view)
 * 4. Front Bumper
 * 5. Free Orbit Inspection
 */

class CameraController {
  constructor(camera, THREE) {
    this.camera = camera;
    this.THREE = THREE;

    this.modes = ['chase', 'close_rear', 'cab_driver', 'bumper', 'orbit'];
    this.currentModeIndex = 0;
    this.mode = 'chase';

    // Camera smoothing targets
    this.targetPos = new THREE.Vector3();
    this.targetLook = new THREE.Vector3();
    this.currentLook = new THREE.Vector3();

    // Orbit parameters
    this.orbitYaw = 0;
    this.orbitPitch = 0.35;
    this.orbitDistance = 8.5;
    this.isDragging = false;
    this.prevMouseX = 0;
    this.prevMouseY = 0;

    // Shake & engine vibration
    this.vibrationAmount = 0;
  }

  setMode(mode) {
    if (this.modes.includes(mode)) {
      this.mode = mode;
      this.currentModeIndex = this.modes.indexOf(mode);
    }
  }

  cycleMode() {
    this.currentModeIndex = (this.currentModeIndex + 1) % this.modes.length;
    this.mode = this.modes[this.currentModeIndex];
    return this.mode;
  }

  handlePointerDown(x, y) {
    this.isDragging = true;
    this.prevMouseX = x;
    this.prevMouseY = y;
  }

  handlePointerMove(x, y) {
    if (!this.isDragging) return;
    const dx = x - this.prevMouseX;
    const dy = y - this.prevMouseY;

    this.orbitYaw -= dx * 0.006;
    this.orbitPitch = Math.max(0.05, Math.min(1.4, this.orbitPitch + dy * 0.006));

    this.prevMouseX = x;
    this.prevMouseY = y;
  }

  handlePointerUp() {
    this.isDragging = false;
  }

  handleZoom(delta) {
    this.orbitDistance = Math.max(4.0, Math.min(22.0, this.orbitDistance + delta * 0.01));
  }

  update(dt, tractorX, tractorY, tractorZ, tractorHeading, tractorPitch, speed, rpm) {
    const THREE = this.THREE;

    // Small engine vibration when tractor is idling or revving
    const vib = (rpm / 2400) * 0.015;
    const vibOffset = Math.sin(Date.now() * 0.04) * vib;

    switch (this.mode) {
      case 'chase': {
        // Positioned 7.5m behind, 3.2m above tractor
        const dist = 7.5 + Math.min(3.5, Math.abs(speed) * 0.25);
        const height = 3.2 + vibOffset;

        const behindX = tractorX - Math.sin(tractorHeading) * dist;
        const behindZ = tractorZ - Math.cos(tractorHeading) * dist;

        this.targetPos.set(behindX, tractorY + height, behindZ);
        this.targetLook.set(tractorX, tractorY + 1.2, tractorZ);

        // Smooth spring interpolation
        this.camera.position.lerp(this.targetPos, Math.min(1, dt * 7.0));
        this.currentLook.lerp(this.targetLook, Math.min(1, dt * 10.0));
        this.camera.lookAt(this.currentLook);
        break;
      }

      case 'close_rear': {
        // Tight 3.8m behind hitch - perfect for trailer reversing
        const dist = 3.8;
        const height = 1.9 + vibOffset;

        const behindX = tractorX - Math.sin(tractorHeading) * dist;
        const behindZ = tractorZ - Math.cos(tractorHeading) * dist;

        this.targetPos.set(behindX, tractorY + height, behindZ);
        this.targetLook.set(tractorX - Math.sin(tractorHeading) * 1.2, tractorY + 0.6, tractorZ - Math.cos(tractorHeading) * 1.2);

        this.camera.position.lerp(this.targetPos, Math.min(1, dt * 12.0));
        this.currentLook.lerp(this.targetLook, Math.min(1, dt * 12.0));
        this.camera.lookAt(this.currentLook);
        break;
      }

      case 'cab_driver': {
        // Cockpit view: at the driver seat looking over the steering wheel and hood
        const cabX = tractorX - Math.sin(tractorHeading) * 0.75;
        const cabZ = tractorZ - Math.cos(tractorHeading) * 0.75;
        const cabY = tractorY + 1.55 + vibOffset;

        this.camera.position.set(cabX, cabY, cabZ);

        // Look forward along hood
        const lookX = tractorX + Math.sin(tractorHeading) * 8.0;
        const lookZ = tractorZ + Math.cos(tractorHeading) * 8.0;
        this.camera.lookAt(lookX, tractorY + 1.2, lookZ);
        break;
      }

      case 'bumper': {
        // Low front bumper camera
        const frontX = tractorX + Math.sin(tractorHeading) * 1.8;
        const frontZ = tractorZ + Math.cos(tractorHeading) * 1.8;

        this.camera.position.set(frontX, tractorY + 0.45, frontZ);
        const lookX = tractorX + Math.sin(tractorHeading) * 12.0;
        const lookZ = tractorZ + Math.cos(tractorHeading) * 12.0;
        this.camera.lookAt(lookX, tractorY + 0.4, lookZ);
        break;
      }

      case 'orbit': {
        // Orbit around tractor
        const ox = tractorX + Math.sin(this.orbitYaw) * Math.cos(this.orbitPitch) * this.orbitDistance;
        const oy = tractorY + Math.sin(this.orbitPitch) * this.orbitDistance + 1.0;
        const oz = tractorZ + Math.cos(this.orbitYaw) * Math.cos(this.orbitPitch) * this.orbitDistance;

        this.camera.position.set(ox, oy, oz);
        this.camera.lookAt(tractorX, tractorY + 1.2, tractorZ);
        break;
      }
    }
  }
}

        },

          let cultivated = 0;
          const patches = world.field1.patches;
          for (const p of patches) {
            if (p.state >= 1) cultivated++;
          }
          const fieldPct = Math.min(50, (cultivated / (patches.length * 0.70)) * 50);
          const dist = Math.hypot(physics.x - (-140), physics.z - (-120));
          const travelPct = physics.trolleyAttached ? Math.max(0, Math.min(50, (1 - dist / 200) * 50)) : 0;
          return fieldPct + travelPct;
        }
      }
    ];
  }

  startMission(id, physics, weather = null) {
    const mission = this.missions.find(m => m.id === id);
    if (!mission) return null;

    this.activeMission = mission;
    if (mission.timeLimit > 0) {
      this.timer = mission.timeLimit;
      this.isTimerActive = true;
    } else {
      this.timer = 0;
      this.isTimerActive = false;
    }

    if (mission.setup) {
      mission.setup(physics, weather);
    }

    return mission;
  }

  update(dt, physics, onComplete, onFail) {
    if (!this.activeMission) return null;

    // Timer countdown
    if (this.isTimerActive) {
      this.timer -= dt;
      if (this.timer <= 0) {
        this.timer = 0;
        this.isTimerActive = false;
        const failedMission = this.activeMission;
        this.activeMission = null;
        if (onFail) onFail(failedMission);
        return { status: 'failed', mission: failedMission };
      }
    }

    // Distance to objective
    const distToTarget = Math.hypot(
      physics.x - this.activeMission.target.x,
      physics.z - this.activeMission.target.z
    );

    // Progress percentage
    const progress = this.activeMission.progress(physics, this.worldManager);

    // Check completion condition
    if (this.activeMission.check(physics, this.worldManager)) {
      const completed = this.activeMission;
      this.completedMissions.add(completed.id);
      this.activeMission = null;
      this.isTimerActive = false;
      if (this.audioManager) this.audioManager.playMissionSuccess();
      if (onComplete) onComplete(completed);
      return { status: 'completed', mission: completed };
    }

    return {
      status: 'active',
      mission: this.activeMission,
      distance: Math.round(distToTarget),
      progress: Math.min(100, Math.round(progress)),
      timer: Math.ceil(this.timer)
    };
  }

  cancelActiveMission() {
    this.activeMission = null;
    this.isTimerActive = false;
    this.timer = 0;
  }
}

/**
 * Indian Tractor Simulator 3D - Save & Load Manager
 * Persists player progression, unlocked tractors, customization,
 * completed missions, and preferences to LocalStorage with fallback validation.
 */

const SAVE_KEY = 'indian_tractor_simulator_save_v1';

class SaveSystem {
  constructor() {
    this.defaultData = {
      coins: 5000, // Starting bonus ₹5,000
      xp: 0,
      level: 1,
      selectedTractor: 'sher855',
      unlockedTractors: ['sher855'],
      customizations: {
        bodyColor: 0x0d47a1, // Swaraj Blue
        rimColor: 0xeeeeee,
        canopy: true,
        bumper: 'heavy_iron'
      },
      completedMissions: [],
      soundSettings: {
        master: 0.85,
        engine: 0.8,
        ambient: 0.5,
        effects: 0.9,
        ui: 0.7,
        muted: false
      },
      graphicsSettings: {
        quality: 'high', // 'low', 'medium', 'high'
        shadows: true,
        particles: true
      },
      controlsSettings: {
        steeringMode: 'buttons', // 'buttons', 'slider'
        steerSensitivity: 1.0,
        speedUnit: 'kmh' // 'kmh', 'mph'
      }
    };

    this.data = this.load();
  }

  load() {
    try {
      const saved = localStorage.getItem(SAVE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        return {
          ...this.defaultData,
          ...parsed,
          customizations: { ...this.defaultData.customizations, ...(parsed.customizations || {}) },
          soundSettings: { ...this.defaultData.soundSettings, ...(parsed.soundSettings || {}) },
          graphicsSettings: { ...this.defaultData.graphicsSettings, ...(parsed.graphicsSettings || {}) },
          controlsSettings: { ...this.defaultData.controlsSettings, ...(parsed.controlsSettings || {}) }
        };
      }
    } catch (e) {
      console.warn('Could not read save data, using defaults:', e);
    }
    return JSON.parse(JSON.stringify(this.defaultData));
  }

  save() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(this.data));
      return true;
    } catch (e) {
      console.error('Failed to save to localStorage:', e);
      return false;
    }
  }

  addReward(coins, xp) {
    this.data.coins += Math.max(0, coins);
    this.data.xp += Math.max(0, xp);

    // Level progression (each level requires Level * 500 XP)
    const requiredXP = this.data.level * 500;
    if (this.data.xp >= requiredXP) {
      this.data.level += 1;
    }
    this.save();
  }

  unlockTractor(tractorId, cost = 0) {
    if (this.data.coins >= cost && !this.data.unlockedTractors.includes(tractorId)) {
      this.data.coins -= cost;
      this.data.unlockedTractors.push(tractorId);
      this.save();
      return true;
    }
    return false;
  }

  selectTractor(tractorId) {
    if (this.data.unlockedTractors.includes(tractorId)) {
      this.data.selectedTractor = tractorId;
      this.save();
      return true;
    }
    return false;
  }

  setCustomization(key, value) {
    this.data.customizations[key] = value;
    this.save();
  }

  markMissionCompleted(missionId) {
    if (!this.data.completedMissions.includes(missionId)) {
      this.data.completedMissions.push(missionId);
      this.save();
    }
  }

  resetProgress() {
    this.data = JSON.parse(JSON.stringify(this.defaultData));
    this.save();
    return this.data;
  }
}

/**
 * Indian Tractor Simulator 3D - User Interface & HUD System
 * Manages Main Menu, Garage, In-Game HUD, Minimap, Fullscreen Map,
 * Mobile Touch Controls, Pause Menu, Settings, and Mission Dialogs.
 */

class UIManager {
  constructor(game) {
    this.game = game;
    this.currentScreen = 'menu'; // 'menu', 'game', 'garage', 'missions', 'map', 'settings', 'controls', 'how_to_play', 'about'

    // DOM Elements cache
    this.container = document.getElementById('ui-root');
    this.minimapCanvas = null;
    this.minimapCtx = null;
  }

  init() {
    this.render();
    this.setupGlobalEvents();
  }

  showScreen(screen) {
    this.currentScreen = screen;
    this.render();
    if (this.game.audio) this.game.audio.playUIClick();
  }

  render() {
    if (!this.container) return;

    let content = '';
    switch (this.currentScreen) {
      case 'menu':
        content = this.renderMainMenu();
        break;
      case 'game':
        content = this.renderGameHUD();
        break;
      case 'garage':
        content = this.renderGarage();
        break;
      case 'missions':
        content = this.renderMissionsList();
        break;
      case 'map':
        content = this.renderFullscreenMap();
        break;
      case 'settings':
        content = this.renderSettings();
        break;
      case 'controls':
        content = this.renderControlsGuide();
        break;
      case 'how_to_play':
        content = this.renderHowToPlay();
        break;
      case 'about':
        content = this.renderAbout();
        break;
    }

    this.container.innerHTML = content;
    this.bindEvents();

    if (this.currentScreen === 'game') {
      this.initMinimap();
      this.initTouchControls();
    }
  }

  // ==========================================
  // MINIMAP RADAR INITIALIZATION & DRAWING
  // ==========================================

  initMinimap() {
    this.minimapCanvas = document.getElementById('minimap-canvas');
    if (this.minimapCanvas) {
      this.minimapCtx = this.minimapCanvas.getContext('2d');
    }
  }

  updateMinimap(tractorX, tractorZ, tractorHeading, waypoints, activeTarget) {
    if (!this.minimapCtx || !this.minimapCanvas) return;
    const ctx = this.minimapCtx;
    const w = this.minimapCanvas.width;
    const h = this.minimapCanvas.height;
    const cx = w * 0.5;
    const cy = h * 0.5;
    const scale = 0.55; // pixels per world meter

    ctx.clearRect(0, 0, w, h);

    // Background circle radar
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, w * 0.48, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = '#2e4922';
    ctx.fillRect(0, 0, w, h);

    // Grid lines
    ctx.strokeStyle = '#3e5e30';
    ctx.lineWidth = 1;
    for (let i = -150; i <= 150; i += 30) {
      ctx.beginPath();
      ctx.moveTo(cx + (i - tractorX) * scale, 0);
      ctx.lineTo(cx + (i - tractorX) * scale, h);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, cy + (i - tractorZ) * scale);
      ctx.lineTo(w, cy + (i - tractorZ) * scale);
      ctx.stroke();
    }

    // Roads
    ctx.fillStyle = '#444444';
    // North-south road (x ~ 0)
    ctx.fillRect(cx + (0 - tractorX) * scale - 2, 0, 4, h);
    // East-west road (z ~ -20)
    ctx.fillRect(0, cy + (-20 - tractorZ) * scale - 2, w, 4);

    // Canal
    ctx.fillStyle = '#00838f';
    ctx.fillRect(cx + (-80 - tractorX) * scale - 5, 0, 10, h);

    // Fields
    ctx.fillStyle = 'rgba(212, 160, 23, 0.4)'; // Wheat field #1
    ctx.fillRect(cx + (-75 - 45 - tractorX) * scale, cy + (85 - 35 - tractorZ) * scale, 90 * scale, 70 * scale);

    ctx.fillStyle = 'rgba(255, 235, 59, 0.4)'; // Mustard field #2
    ctx.fillRect(cx + (85 - 40 - tractorX) * scale, cy + (95 - 30 - tractorZ) * scale, 80 * scale, 60 * scale);

    // Waypoints
    for (const key in waypoints) {
      const wp = waypoints[key];
      const wx = cx + (wp.x - tractorX) * scale;
      const wz = cy + (wp.z - tractorZ) * scale;

      ctx.fillStyle = '#' + wp.color.toString(16).padStart(6, '0');
      ctx.beginPath();
      ctx.arc(wx, wz, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    // Active Mission Beacon
    if (activeTarget) {
      const tx = cx + (activeTarget.x - tractorX) * scale;
      const tz = cy + (activeTarget.z - tractorZ) * scale;

      const pulse = (Math.sin(Date.now() * 0.008) + 1) * 3 + 6;
      ctx.strokeStyle = '#ff9800';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(tx, tz, pulse, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#ff5722';
      ctx.beginPath();
      ctx.arc(tx, tz, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Tractor Icon (Red arrow at center pointing in tractorHeading)
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-tractorHeading);

    ctx.fillStyle = '#f44336';
    ctx.beginPath();
    ctx.moveTo(0, -9);
    ctx.lineTo(6, 7);
    ctx.lineTo(0, 4);
    ctx.lineTo(-6, 7);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
    ctx.restore();

    // Radar border ring
    ctx.strokeStyle = '#81c784';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, w * 0.48, 0, Math.PI * 2);
    ctx.stroke();
  }

  // ==========================================
  // MOBILE TOUCH CONTROLS BINDINGS
  // ==========================================

  initTouchControls() {
    const inputs = this.game.inputs;

    const bindTouch = (elemId, onDown, onUp) => {
      const el = document.getElementById(elemId);
      if (!el) return;

      const handleDown = (e) => {
        e.preventDefault();
        onDown();
      };
      const handleUp = (e) => {
        e.preventDefault();
        onUp();
      };

      el.addEventListener('pointerdown', handleDown);
      el.addEventListener('pointerup', handleUp);
      el.addEventListener('pointercancel', handleUp);
      el.addEventListener('pointerleave', handleUp);
    };

    bindTouch('touch-steer-left', () => { inputs.steerLeft = true; }, () => { inputs.steerLeft = false; });
    bindTouch('touch-steer-right', () => { inputs.steerRight = true; }, () => { inputs.steerRight = false; });
    bindTouch('touch-gas', () => { inputs.accelerate = true; }, () => { inputs.accelerate = false; });
    bindTouch('touch-brake', () => { inputs.brake = true; }, () => { inputs.brake = false; });

    // Single-click action buttons
    const bindClick = (elemId, callback) => {
      const el = document.getElementById(elemId);
      if (el) el.addEventListener('click', (e) => { e.preventDefault(); callback(); });
    };

    bindClick('touch-horn', () => {
      if (this.game.audio) {
        this.game.audio.startHorn();
        setTimeout(() => this.game.audio.stopHorn(), 500);
      }
    });

    bindClick('touch-lights', () => this.game.toggleHeadlights());
    bindClick('touch-hitch', () => this.game.toggleHitch());
    bindClick('touch-implement', () => this.game.toggleImplement());
    bindClick('touch-reset', () => this.game.resetTractor());
  }

  showToast(message) {
    const toast = document.getElementById('toast-notify');
    if (!toast) return;
    toast.textContent = message;
    toast.classList.add('visible');
    setTimeout(() => {
      toast.classList.remove('visible');
    }, 2800);
  }

  // ==========================================
  // DOM EVENT DELEGATION
  // ==========================================

  bindEvents() {
    // Menu Buttons
    const on = (id, fn) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('click', fn);
    };

    on('btn-play', () => this.game.startGame('normal'));
    on('btn-quick-drive', () => this.game.startGame('quick'));
    on('btn-garage', () => this.showScreen('garage'));
    on('btn-missions', () => this.showScreen('missions'));
    on('btn-map', () => this.showScreen('map'));
    on('btn-settings', () => this.showScreen('settings'));
    on('btn-controls', () => this.showScreen('controls'));
    on('btn-how-to-play', () => this.showScreen('how_to_play'));
    on('btn-about', () => this.showScreen('about'));

    on('btn-new-game', () => {
      if (confirm('Start New Game? This will reset all mission progress and currency.')) {
        this.game.save.resetProgress();
        this.render();
      }
    });

    // Close Modals
    on('modal-close', () => this.showScreen(this.game.isRunning ? 'game' : 'menu'));
    on('garage-back', () => this.showScreen('menu'));
    on('garage-drive-btn', () => this.game.startGame('normal'));

    // In-Game HUD Controls
    on('hud-btn-weather', () => this.game.cycleWeather());
    on('hud-btn-time', () => this.game.cycleTimeOfDay());
    on('hud-btn-cam', () => this.game.cycleCamera());
    on('hud-btn-map', () => this.showScreen('map'));
    on('hud-btn-pause', () => this.game.togglePause());

    // Garage Swatches
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const tId = e.currentTarget.dataset.tractor;
        this.game.selectTractorInGarage(tId);
      });
    });

    document.querySelectorAll('.color-swatch').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const col = parseInt(e.currentTarget.dataset.color);
        this.game.setTractorPaint(col);
      });
    });

    document.querySelectorAll('.rim-swatch').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const rim = parseInt(e.currentTarget.dataset.rim);
        this.game.setTractorRim(rim);
      });
    });

    // Mission Start Buttons
    document.querySelectorAll('.btn-start-mission').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = parseInt(e.currentTarget.dataset.id);
        this.game.startMission(id);
      });
    });

    // Audio Sliders
    const bindSlider = (id, channel) => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', (e) => {
          const val = parseFloat(e.target.value);
          this.game.setVolume(channel, val);
        });
      }
    };
    bindSlider('vol-master', 'master');
    bindSlider('vol-engine', 'engine');
    bindSlider('vol-ambient', 'ambient');
    bindSlider('vol-effects', 'effects');

    const chkMute = document.getElementById('chk-mute');
    if (chkMute) {
      chkMute.addEventListener('change', (e) => {
        this.game.setMute(e.target.checked);
      });
    }
  }

  setupGlobalEvents() {
    window.addEventListener('keydown', (e) => {
      if (this.currentScreen === 'game') {
        if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
          this.game.togglePause();
        }
        if (e.key === 'm' || e.key === 'M') {
          this.showScreen('map');
        }
      } else if (e.key === 'Escape') {
        this.showScreen(this.game.isRunning ? 'game' : 'menu');
      }
    });
  }
}


  // ==========================================
  // MODULE: game.js
  // ==========================================
/**
 * Indian Tractor Simulator 3D - Master Game Controller
 * Orchestrates 3D rendering, physics simulation, audio synthesis,
 * input handling, mission progression, and UI state.
 */











class Game {
  constructor() {
    this.THREE = window.THREE;

    this.container = document.getElementById('canvas-container');
    this.renderer = null;
    this.scene = null;
    this.camera = null;

    // Subsystems
    this.audio = new AudioManager();
    this.physics = new VehiclePhysics();
    this.save = new SaveSystem();
    this.modelFactory = null;
    this.world = null;
    this.weather = null;
    this.cameraController = null;
    this.missions = null;
    this.ui = new UIManager(this);

    // Active 3D Vehicle Objects
    this.tractorObj = null;
    this.trolleyObj = null;
    this.implementObj = null;

    // Visual Particle Systems (Exhaust smoke & Soil dust)
    this.exhaustParticles = [];

    // Game Runtime State
    this.isRunning = false;
    this.isPaused = false;
    this.lastTime = performance.now();
    this.headlightsOn = false;
    this.fuelLevel = 100; // Functional fuel system

    // Input State
    this.inputs = {
      accelerate: false,
      brake: false,
      steerLeft: false,
      steerRight: false,
      handbrake: false,
      steeringSlider: 0
    };

    // Day-Night and Weather cycles
    this.weathers = ['sunny', 'cloudy', 'rainy', 'foggy'];
    this.timesOfDay = ['morning', 'afternoon', 'evening', 'night'];
    this.weatherIndex = 0;
    this.timeIndex = 0;
  }

  init() {
    if (!window.THREE) {
      console.error('Three.js is not loaded!');
      return;
    }
    this.THREE = window.THREE;

    // 1. Scene & Renderer
    this.scene = new this.THREE.Scene();

    this.renderer = new this.THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = this.THREE.PCFSoftShadowMap;

    this.container.appendChild(this.renderer.domElement);

    // 2. Camera
    this.camera = new this.THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.3, 800);
    this.cameraController = new CameraController(this.camera, this.THREE);

    // 3. Subsystems
    this.modelFactory = new ModelFactory(this.THREE);
    this.world = new WorldManager(this.THREE);
    this.world.build();
    this.scene.add(this.world.root);

    this.weather = new WeatherSystem(this.scene, this.THREE);
    this.missions = new MissionSystem(this.world, this.audio);

    // Load saved preferences
    this.applySavedPreferences();

    // 4. Build Tractor and Trolley
    this.spawnTractor(this.save.data.selectedTractor);
    this.spawnTrolley();
    this.spawnImplement('cultivator');

    // 5. Initialize Exhaust Smoke Particles
    this.initExhaustParticles();

    // 6. Setup Event Listeners
    this.setupInputs();
    window.addEventListener('resize', () => this.handleResize());

    // 7. Initialize UI
    this.ui.init();

    // Start Master Render & Physics Loop
    requestAnimationFrame((t) => this.loop(t));
  }

  applySavedPreferences() {
    const sound = this.save.data.soundSettings;
    this.audio.setVolume('master', sound.master);
    this.audio.setVolume('engine', sound.engine);
    this.audio.setVolume('ambient', sound.ambient);
    this.audio.setVolume('effects', sound.effects);
    this.audio.setMute(sound.muted);
  }

  // ==========================================
  // VEHICLE SPAWNING
  // ==========================================

  spawnTractor(type = 'sher855') {
    if (this.tractorObj) {
      this.scene.remove(this.tractorObj.root);
    }

    const customColor = this.save.data.customizations.bodyColor;
    const customRim = this.save.data.customizations.rimColor;

    this.tractorObj = this.modelFactory.createTractor(type, customColor, customRim);
    this.scene.add(this.tractorObj.root);

    // Initial position at farm yard shed
    this.physics.reset(-20, -25, Math.PI);
  }

  spawnTrolley() {
    if (this.trolleyObj) {
      this.scene.remove(this.trolleyObj.root);
    }

    this.trolleyObj = this.modelFactory.createTrolley();
    this.scene.add(this.trolleyObj.root);

    // Load cargo sacks
    const cargo = this.modelFactory.createCargoLoad('wheat', 10);
    this.trolleyObj.cargoGroup.add(cargo);

    // Park trolley near farm yard
    this.physics.trolleyX = -20;
    this.physics.trolleyY = 0.85;
    this.physics.trolleyZ = -29;
    this.physics.trolleyHeading = Math.PI;
    this.physics.trolleyAttached = false;
  }

  spawnImplement(type = 'cultivator') {
    if (this.implementObj) {
      this.scene.remove(this.implementObj.root);
    }

    this.implementObj = this.modelFactory.createImplement(type);
    this.tractorObj.root.add(this.implementObj.root);
    this.implementObj.root.position.set(0, 0.1, -1.6);
    this.physics.implementAttached = type;
  }

  initExhaustParticles() {
    const THREE = this.THREE;
    const count = 35;
    const geo = new THREE.SphereGeometry(0.08, 6, 6);
    const mat = new THREE.MeshBasicMaterial({
      color: 0x333333,
      transparent: true,
      opacity: 0.6
    });

    for (let i = 0; i < count; i++) {
      const mesh = new THREE.Mesh(geo, mat.clone());
      mesh.visible = false;
      this.scene.add(mesh);
      this.exhaustParticles.push({
        mesh,
        life: 0,
        maxLife: 0.6 + Math.random() * 0.4,
        vx: 0,
        vy: 0,
        vz: 0
      });
    }
  }

  emitExhaustSmoke(x, y, z, rpm) {
    const p = this.exhaustParticles.find(item => !item.mesh.visible);
    if (!p) return;

    p.mesh.position.set(x, y, z);
    p.mesh.scale.set(1, 1, 1);
    p.mesh.visible = true;
    p.life = 0;
    p.maxLife = 0.5 + Math.random() * 0.4;

    const upwardSpeed = 1.8 + (rpm / 2400) * 3.5;
    p.vy = upwardSpeed;
    p.vx = (Math.random() - 0.5) * 0.4;
    p.vz = (Math.random() - 0.5) * 0.4;
  }

  updateExhaustParticles(dt) {
    for (const p of this.exhaustParticles) {
      if (!p.mesh.visible) continue;
      p.life += dt;
      if (p.life >= p.maxLife) {
        p.mesh.visible = false;
        continue;
      }

      p.mesh.position.y += p.vy * dt;
      p.mesh.position.x += p.vx * dt;
      p.mesh.position.z += p.vz * dt;

      const progress = p.life / p.maxLife;
      const s = 1.0 + progress * 4.5;
      p.mesh.scale.set(s, s, s);
      p.mesh.material.opacity = (1 - progress) * 0.5;
    }
  }

  // ==========================================
  // INPUT PROCESSING
  // ==========================================

  setupInputs() {
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

      switch (e.code) {
        case 'KeyW':
        case 'ArrowUp':
          this.inputs.accelerate = true;
          break;
        case 'KeyS':
        case 'ArrowDown':
          this.inputs.brake = true;
          break;
        case 'KeyA':
        case 'ArrowLeft':
          this.inputs.steerLeft = true;
          break;
        case 'KeyD':
        case 'ArrowRight':
          this.inputs.steerRight = true;
          break;
        case 'Space':
          this.inputs.handbrake = true;
          break;
        case 'KeyH':
          if (!e.repeat) this.audio.startHorn('punjabi');
          break;
        case 'KeyL':
          if (!e.repeat) this.toggleHeadlights();
          break;
        case 'KeyC':
          if (!e.repeat) this.cycleCamera();
          break;
        case 'KeyE':
          if (!e.repeat) this.toggleImplement();
          break;
        case 'KeyG':
          if (!e.repeat) this.toggleHitch();
          break;
        case 'KeyR':
          if (!e.repeat) this.resetTractor();
          break;
        case 'KeyF':
          if (!e.repeat) this.toggleEngine();
          break;
      }
    });

    window.addEventListener('keyup', (e) => {
      switch (e.code) {
        case 'KeyW':
        case 'ArrowUp':
          this.inputs.accelerate = false;
          break;
        case 'KeyS':
        case 'ArrowDown':
          this.inputs.brake = false;
          break;
        case 'KeyA':
        case 'ArrowLeft':
          this.inputs.steerLeft = false;
          break;
        case 'KeyD':
        case 'ArrowRight':
          this.inputs.steerRight = false;
          break;
        case 'Space':
          this.inputs.handbrake = false;
          break;
        case 'KeyH':
          this.audio.stopHorn();
          break;
      }
    });

    // Orbit camera mouse drag controls
    window.addEventListener('mousedown', (e) => {
      if (this.cameraController.mode === 'orbit' || !this.isRunning) {
        this.cameraController.handlePointerDown(e.clientX, e.clientY);
      }
    });
    window.addEventListener('mousemove', (e) => {
      this.cameraController.handlePointerMove(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', () => {
      this.cameraController.handlePointerUp();
    });
    window.addEventListener('wheel', (e) => {
      this.cameraController.handleZoom(e.deltaY);
    }, { passive: true });
  }

  // ==========================================
  // GAMEPLAY ACTIONS
  // ==========================================

  startGame(mode = 'normal') {
    this.isRunning = true;
    this.isPaused = false;
    this.ui.showScreen('game');

    // Initialize audio context on player gesture
    this.audio.init();
    this.audio.startEngine();

    if (mode === 'quick') {
      this.ui.showToast('🚀 Quick Drive: Open World Free Roam!');
    } else {
      this.ui.showToast('🌾 Indian Tractor Simulator: Welcome to the Pind!');
    }
  }

  togglePause() {
    if (!this.isRunning) return;
    this.isPaused = !this.isPaused;
    if (this.isPaused) {
      this.ui.showToast('⏸️ Game Paused');
    } else {
      this.ui.showToast('▶️ Resumed');
    }
  }

  toggleEngine() {
    this.physics.engineOn = !this.physics.engineOn;
    if (this.physics.engineOn) {
      this.audio.startEngine();
      this.ui.showToast('⚡ Tractor Diesel Engine Started');
    } else {
      this.audio.stopEngine();
      this.ui.showToast('🛑 Engine Switched Off');
    }
  }

  toggleHeadlights() {
    this.headlightsOn = !this.headlightsOn;
    const intensity = this.headlightsOn ? 2.5 : 0;
    this.tractorObj.headlights.leftSpot.intensity = intensity;
    this.tractorObj.headlights.rightSpot.intensity = intensity;
    this.tractorObj.headlights.leftLens.material = this.headlightsOn ? this.modelFactory.materials.headlightOn : this.modelFactory.materials.headlightGlass;
    this.tractorObj.headlights.rightLens.material = this.tractorObj.headlights.leftLens.material;

    this.audio.playUIClick();
    this.ui.showToast(this.headlightsOn ? '💡 Headlights ON' : '💡 Headlights OFF');
  }

  toggleHitch() {
    if (this.physics.trolleyAttached) {
      // Detach trolley
      this.physics.detachTrolley();
      this.audio.playHitchSound(false);
      this.ui.showToast('🔗 Trolley Detached');
    } else {
      // Check distance to trolley
      const hitchX = this.physics.x - Math.sin(this.physics.heading) * this.physics.hitchOffset;
      const hitchZ = this.physics.z - Math.cos(this.physics.heading) * this.physics.hitchOffset;
      const dist = Math.hypot(hitchX - this.physics.trolleyX, hitchZ - this.physics.trolleyZ);

      if (dist < 4.5) {
        this.physics.attachTrolley();
        this.audio.playHitchSound(true);
        this.ui.showToast('🔗 Trolley Attached Successfully!');
      } else {
        this.ui.showToast(`⚠️ Too far to hitch! Reverse closer (${Math.round(dist)}m)`);
      }
    }
  }

  toggleImplement() {
    const lowered = this.physics.toggleEquipmentLower();
    this.audio.playUIClick();
    if (lowered) {
      this.ui.showToast('🌾 Farming Tool LOWERED (Working Soil)');
    } else {
      this.ui.showToast('🌾 Farming Tool RAISED (Transport Mode)');
    }
  }

  resetTractor() {
    // Upright tractor on road or nearest safe coordinate
    this.physics.reset(this.physics.x, this.physics.z, this.physics.heading);
    this.audio.playHitchSound(true);
    this.ui.showToast('🔄 Tractor Reset Upright');
  }

  cycleCamera() {
    const mode = this.cameraController.cycleMode();
    const names = {
      chase: 'Third-Person Chase',
      close_rear: 'Close Rear Hitch',
      cab_driver: 'Cockpit Driver View',
      bumper: 'Front Bumper',
      orbit: 'Free Orbit Inspection'
    };
    const label = names[mode] || mode;
    const el = document.getElementById('hud-cam-val');
    if (el) el.textContent = label.split(' ')[0];
    this.ui.showToast(`📷 Camera: ${label}`);
  }

  cycleWeather() {
    this.weatherIndex = (this.weatherIndex + 1) % this.weathers.length;
    const w = this.weathers[this.weatherIndex];
    this.weather.setWeather(w, this.audio);
    const el = document.getElementById('hud-weather-val');
    if (el) el.textContent = w.toUpperCase();
    this.ui.showToast(`🌤️ Weather: ${w.toUpperCase()}`);
  }

  cycleTimeOfDay() {
    this.timeIndex = (this.timeIndex + 1) % this.timesOfDay.length;
    const t = this.timesOfDay[this.timeIndex];
    this.weather.setTimeOfDay(t);
    const el = document.getElementById('hud-time-val');
    if (el) el.textContent = t.toUpperCase();
    this.world.setStreetlightsActive(t === 'night');
    this.ui.showToast(`☀️ Time: ${t.toUpperCase()}`);
  }

  startMission(id) {
    const mission = this.missions.startMission(id, this.physics, this.weather);
    if (mission) {
      this.startGame('normal');
      this.ui.showToast(`🎯 Started: ${mission.title}`);
    }
  }

  selectTractorInGarage(tractorId) {
    if (this.save.data.unlockedTractors.includes(tractorId)) {
      this.save.selectTractor(tractorId);
      this.spawnTractor(tractorId);
      this.ui.render();
      this.ui.showToast(`🚜 Equipped ${this.tractorObj.config.name}`);
    } else {
      const tractors = [
        { id: 'samrat575', cost: 6000 },
        { id: 'raftaar5050', cost: 12000 }
      ];
      const t = tractors.find(x => x.id === tractorId);
      if (t && this.save.unlockTractor(t.id, t.cost)) {
        this.save.selectTractor(t.id);
        this.spawnTractor(t.id);
        this.audio.playMissionSuccess();
        this.ui.render();
        this.ui.showToast(`🎉 Purchased & Equipped ${this.tractorObj.config.name}!`);
      } else {
        this.ui.showToast(`⚠️ Not enough money! Requires ₹${t ? t.cost.toLocaleString('en-IN') : 0}`);
      }
    }
  }

  setTractorPaint(color) {
    this.save.setCustomization('bodyColor', color);
    this.spawnTractor(this.save.data.selectedTractor);
    this.ui.showToast('🎨 Custom Paint Applied');
  }

  setTractorRim(rimColor) {
    this.save.setCustomization('rimColor', rimColor);
    this.spawnTractor(this.save.data.selectedTractor);
    this.ui.showToast('🚜 Custom Rims Applied');
  }

  setVolume(channel, val) {
    this.audio.setVolume(channel, val);
    this.save.data.soundSettings[channel] = val;
    this.save.save();
  }

  setMute(mute) {
    this.audio.setMute(mute);
    this.save.data.soundSettings.muted = mute;
    this.save.save();
  }

  handleResize() {
    if (!this.camera || !this.renderer) return;
    this.camera.aspect = window.innerWidth / window.innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(window.innerWidth, window.innerHeight);
  }

  // ==========================================
  // MASTER TICK & RENDER LOOP
  // ==========================================

  loop(currentTime) {
    requestAnimationFrame((t) => this.loop(t));

    const dt = Math.min(0.05, (currentTime - this.lastTime) * 0.001);
    this.lastTime = currentTime;

    // 1. Simulation step
    if (this.isRunning && !this.isPaused) {
      // Physics step
      this.physics.update(
        dt,
        this.inputs,
        (x, z) => this.world.getTerrainHeight(x, z),
        (x, z) => this.world.getSurfaceType(x, z)
      );

      // Interactive Farming: If cultivator is lowered in Field #1, till soil
      if (this.physics.implementAttached && this.physics.implementLowered) {
        const hitchX = this.physics.x - Math.sin(this.physics.heading) * 1.6;
        const hitchZ = this.physics.z - Math.cos(this.physics.heading) * 1.6;
        this.world.updateSoilCultivation(hitchX, hitchZ, 2.5, this.physics.implementAttached === 'cultivator');
      }

      // Fuel consumption simulation
      if (this.physics.engineOn && Math.abs(this.physics.speed) > 0.5) {
        this.fuelLevel = Math.max(0, this.fuelLevel - dt * 0.015);
      }

      // Audio engine update
      this.audio.updateEngine(this.physics.rpm, this.inputs.accelerate ? 1 : 0);

      // Mission progress check
      this.missions.update(
        dt,
        this.physics,
        (completed) => {
          this.save.addReward(completed.reward, completed.xp);
          this.save.markMissionCompleted(completed.id);
          this.ui.render();
          this.ui.showToast(`🏆 MISSION COMPLETE: ${completed.title}! +₹${completed.reward.toLocaleString('en-IN')}`);
        },
        (failed) => {
          this.ui.showToast(`❌ TIME OUT: ${failed.title} Failed!`);
        }
      );

      // Ambient birds random chirp
      if (Math.random() < 0.0015 && this.weather.currentTimeOfDay === 'morning') {
        this.audio.playVillageBirdChirp();
      }
    }

    // 2. Synchronize 3D Vehicle Models with Physics
    this.syncTractorVisuals(dt);
    this.syncTrolleyVisuals(dt);

    // 3. Update Weather & Particles
    this.weather.update(dt, this.physics.x, this.physics.z);
    this.updateExhaustParticles(dt);

    // 4. Update Camera
    if (this.isRunning) {
      this.cameraController.update(
        dt,
        this.physics.x,
        this.physics.y,
        this.physics.z,
        this.physics.heading,
        this.physics.pitch,
        this.physics.speed,
        this.physics.rpm
      );
    } else {
      // Menu / Garage Turntable orbit showcase
      const angle = currentTime * 0.00045;
      const camDist = 6.8;
      this.camera.position.set(
        this.physics.x + Math.sin(angle) * camDist,
        this.physics.y + 2.2,
        this.physics.z + Math.cos(angle) * camDist
      );
      this.camera.lookAt(this.physics.x, this.physics.y + 1.1, this.physics.z);
    }

    // 5. Update HUD Displays
    if (this.isRunning && this.ui.currentScreen === 'game') {
      this.updateHUDValues();
    }

    // 6. Render 3D Scene
    this.renderer.render(this.scene, this.camera);
  }

  syncTractorVisuals(dt) {
    if (!this.tractorObj) return;

    // Position and orientation
    this.tractorObj.root.position.set(this.physics.x, this.physics.y, this.physics.z);
    this.tractorObj.root.rotation.set(this.physics.pitch, this.physics.heading, 0, 'YXZ');

    // Front steering wheel angle
    this.tractorObj.frontLeftWheel.steer.rotation.y = this.physics.steerAngle;
    this.tractorObj.frontRightWheel.steer.rotation.y = this.physics.steerAngle;

    // Rolling wheel spin
    this.tractorObj.frontLeftWheel.spin.rotation.x = this.physics.frontWheelRotation;
    this.tractorObj.frontRightWheel.spin.rotation.x = this.physics.frontWheelRotation;
    this.tractorObj.rearLeftWheel.spin.rotation.x = this.physics.rearWheelRotation;
    this.tractorObj.rearRightWheel.spin.rotation.x = this.physics.rearWheelRotation;

    // Cockpit steering wheel turn
    this.tractorObj.steeringWheel.rotation.z = -this.physics.steeringWheelRotation;

    // Exhaust flapper flutter
    if (this.physics.engineOn) {
      this.tractorObj.flapper.rotation.z = 0.25 + Math.sin(Date.now() * 0.05) * 0.15;

      // Exhaust smoke emission
      if (Math.random() < 0.35) {
        const exhX = this.physics.x + Math.sin(this.physics.heading) * 0.85 + Math.cos(this.physics.heading) * 0.38;
        const exhZ = this.physics.z + Math.cos(this.physics.heading) * 0.85 - Math.sin(this.physics.heading) * 0.38;
        const exhY = this.physics.y + 1.9;
        this.emitExhaustSmoke(exhX, exhY, exhZ, this.physics.rpm);
      }
    }

    // Brake lights active
    const isBraking = this.inputs.brake || this.inputs.handbrake;
    const tailMat = isBraking ? this.modelFactory.materials.taillightOn : this.modelFactory.materials.taillightOff;
    this.tractorObj.taillights.left.material = tailMat;
    this.tractorObj.taillights.right.material = tailMat;

    // Implement lowering animation
    if (this.implementObj) {
      const lowerY = -this.physics.implementProgress * 0.45;
      this.implementObj.root.position.y = 0.1 + lowerY;
    }
  }

  syncTrolleyVisuals(dt) {
    if (!this.trolleyObj) return;

    this.trolleyObj.root.position.set(this.physics.trolleyX, this.physics.trolleyY, this.physics.trolleyZ);
    this.trolleyObj.root.rotation.set(0, this.physics.trolleyHeading, 0);

    // Trolley wheel spin
    this.trolleyObj.leftWheel.spin.rotation.x = this.physics.trolleyWheelRotation;
    this.trolleyObj.rightWheel.spin.rotation.x = this.physics.trolleyWheelRotation;
  }

  updateHUDValues() {
    // Speed (km/h)
    const kmh = Math.round(Math.abs(this.physics.speed) * 3.6);
    const elSpeed = document.getElementById('dash-speed');
    if (elSpeed) elSpeed.textContent = kmh;

    // RPM
    const rpm = Math.round(this.physics.rpm);
    const elRpm = document.getElementById('dash-rpm');
    if (elRpm) elRpm.textContent = rpm;
    const rpmFill = document.getElementById('rpm-bar');
    if (rpmFill) rpmFill.style.width = `${Math.min(100, (rpm / 2400) * 100)}%`;

    // Gear
    const elGear = document.getElementById('dash-gear');
    if (elGear) {
      if (this.physics.currentGear === -1) elGear.textContent = 'R';
      else if (this.physics.currentGear === 0) elGear.textContent = 'N';
      else elGear.textContent = `D${this.physics.currentGear}`;
    }

    // Indicators
    const indEngine = document.getElementById('ind-engine');
    if (indEngine) indEngine.style.opacity = this.physics.engineOn ? '1.0' : '0.2';

    const indLight = document.getElementById('ind-light');
    if (indLight) indLight.style.opacity = this.headlightsOn ? '1.0' : '0.2';

    const indBrake = document.getElementById('ind-brake');
    if (indBrake) indBrake.style.opacity = (this.inputs.brake || this.inputs.handbrake) ? '1.0' : '0.2';

    // Mission HUD details
    const mission = this.missions.activeMission;
    const missionCard = document.getElementById('mission-card');
    if (mission && missionCard) {
      missionCard.classList.remove('hidden');
      const dist = Math.round(Math.hypot(this.physics.x - mission.target.x, this.physics.z - mission.target.z));
      const distEl = document.getElementById('mission-dist-text');
      if (distEl) distEl.textContent = `Target: ${mission.target.name} (${dist}m)`;

      const progEl = document.getElementById('mission-progress-fill');
      if (progEl) {
        const pct = mission.progress(this.physics, this.world);
        progEl.style.width = `${Math.min(100, Math.round(pct))}%`;
      }

      const timerEl = document.getElementById('mission-timer-text');
      if (timerEl && this.missions.isTimerActive) {
        timerEl.textContent = `⏱️ ${Math.ceil(this.missions.timer)}s`;
      }
    } else if (missionCard) {
      missionCard.classList.add('hidden');
    }

    // Implement Card details
    const implName = document.getElementById('impl-name');
    const implState = document.getElementById('impl-state');
    if (implName && implState) {
      if (this.physics.trolleyAttached) {
        implName.textContent = 'Tractor Trolley Attached';
        implState.textContent = `Cargo: ${this.physics.trolleyCargoCount} Bags [G: Detach]`;
      } else if (this.physics.implementAttached) {
        const tool = this.physics.implementAttached === 'cultivator' ? 'Spring Cultivator' : 'Farming Tool';
        implName.textContent = tool;
        implState.textContent = this.physics.implementLowered ? 'Lowered (Working) [E]' : 'Raised (Transport) [E]';
      } else {
        implName.textContent = 'Tractor Solo';
        implState.textContent = 'Ready for hitching [G]';
      }
    }

    // Minimap Radar update
    this.ui.updateMinimap(
      this.physics.x,
      this.physics.z,
      this.physics.heading,
      this.world.waypoints,
      mission ? mission.target : null
    );
  }
}

// Global bootstrap
function bootGame() {
  if (!window.THREE) {
    const ui = document.getElementById('ui-root');
    if (ui) {
      ui.innerHTML = `
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; max-width: 520px; padding: 30px; background: rgba(18,22,30,0.95); border: 2px solid #ffb300; border-radius: 12px; font-family: 'Rajdhani', sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
          <h2 style="color: #ffb300; font-size: 2.2rem; font-family: 'Teko', sans-serif; letter-spacing: 1px;">🚜 INDIAN TRACTOR SIMULATOR 3D</h2>
          <p style="margin: 16px 0; color: #cfd8dc; font-size: 1.05rem; line-height: 1.5;">The 3D WebGL engine is connecting. Please check your internet connection for the initial 3D shader library download or refresh the page.</p>
          <button onclick="location.reload()" style="background: linear-gradient(135deg, #ffb300, #ff6f00); color: #111; border: none; padding: 12px 28px; font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-family: 'Rajdhani', sans-serif;">RELOAD GAME</button>
        </div>
      `;
    }
    return;
  }
  const game = new Game();
  window.game = game;
  game.init();
}

if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', bootGame);
} else {
  bootGame();
}


})();

  </script>
</body>
