<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>INDIAN TRACTOR SIMULATOR 3D — Desi Farmer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚜</text></svg>" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Inline All Styles (Single File Standalone) -->
  <style>
/* Indian Tractor Simulator 3D - High-Performance Game Styles */
:root {
  --primary-gold: #ffb300;
  --accent-saffron: #ff6f00;
  --tractor-blue: #1976d2;
  --field-green: #2e7d32;
  --bg-dark: rgba(18, 22, 28, 0.92);
  --panel-bg: rgba(28, 34, 44, 0.88);
  --border-glow: rgba(255, 179, 0, 0.4);
  --font-display: 'Teko', sans-serif;
  --font-sub: 'Rajdhani', sans-serif;
  --font-body: 'Inter', sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

body, html {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #000;
  color: #fff;
  font-family: var(--font-body);
}

#canvas-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

#ui-root {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  pointer-events: none;
}

/* ==========================================
   BUTTONS & TYPOGRAPHY
   ========================================== */
.btn {
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
  border: none;
  transition: all 0.18s ease;
  font-family: var(--font-sub);
  font-weight: 700;
  letter-spacing: 1px;
}

.btn-primary {
  background: linear-gradient(135deg, #ffb300, #ff6f00);
  color: #111;
  box-shadow: 0 4px 15px rgba(255, 111, 0, 0.45);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 22px rgba(255, 111, 0, 0.65);
}

.btn-secondary {
  background: var(--panel-bg);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(8px);
}
.btn-secondary:hover {
  background: rgba(45, 55, 72, 0.95);
  border-color: var(--primary-gold);
  transform: translateY(-2px);
}

.btn-outline {
  background: rgba(0, 0, 0, 0.45);
  color: #ccc;
  border: 1px solid rgba(255, 255, 255, 0.12);
}
.btn-outline:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}

.btn-icon {
  font-size: 1.4rem;
  margin-bottom: 2px;
}
.btn-text {
  font-size: 1.1rem;
}
.btn-sub {
  font-size: 0.72rem;
  opacity: 0.75;
  font-weight: 500;
}

/* ==========================================
   MAIN MENU OVERLAY
   ========================================== */
.menu-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 50% 30%, rgba(0, 0, 0, 0.15), rgba(8, 12, 16, 0.88));
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 30px 40px;
  pointer-events: auto;
}

.menu-header {
  text-align: center;
}
.badge-flag {
  display: inline-block;
  padding: 4px 14px;
  background: rgba(255, 111, 0, 0.2);
  border: 1px solid rgba(255, 111, 0, 0.6);
  border-radius: 20px;
  font-size: 0.82rem;
  letter-spacing: 2px;
  color: var(--primary-gold);
  margin-bottom: 8px;
  font-weight: 600;
}
.game-title {
  font-family: var(--font-display);
  font-size: 4.2rem;
  line-height: 0.9;
  letter-spacing: 2px;
  text-shadow: 0 4px 20px rgba(0,0,0,0.8);
}
.game-title .highlight {
  color: var(--primary-gold);
}
.game-tagline {
  font-family: var(--font-sub);
  font-size: 1.15rem;
  letter-spacing: 1.5px;
  color: #b0bec5;
  margin-top: 6px;
}
.player-stats-bar {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin-top: 15px;
  font-family: var(--font-sub);
  font-size: 1.05rem;
  font-weight: 600;
  color: #ffd54f;
}

.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  max-width: 950px;
  margin: 0 auto;
  width: 100%;
}

.menu-footer {
  text-align: center;
  font-size: 0.8rem;
  opacity: 0.6;
}

/* ==========================================
   IN-GAME HUD
   ========================================== */
.hud-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.hud-top-bar {
  position: absolute;
  top: 16px;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
}

.hud-stats {
  display: flex;
  gap: 10px;
  pointer-events: auto;
}
.stat-pill {
  background: var(--bg-dark);
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 8px 16px;
  border-radius: 20px;
  font-family: var(--font-sub);
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--primary-gold);
  backdrop-filter: blur(6px);
}

.hud-center-controls {
  display: flex;
  gap: 8px;
  pointer-events: auto;
}
.pill-btn {
  background: var(--bg-dark);
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: #fff;
  padding: 7px 14px;
  border-radius: 18px;
  font-family: var(--font-sub);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.pill-btn:hover {
  border-color: var(--primary-gold);
  background: rgba(45, 55, 72, 0.95);
}

.hud-top-right {
  display: flex;
  gap: 8px;
  pointer-events: auto;
}
.icon-btn {
  background: var(--bg-dark);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 1.15rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.icon-btn:hover {
  background: var(--primary-gold);
  color: #111;
}

/* Minimap */
.minimap-container {
  position: absolute;
  top: 75px;
  right: 16px;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
  pointer-events: auto;
}
.minimap-label {
  position: absolute;
  bottom: 6px;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 0.65rem;
  font-weight: 700;
  color: #81c784;
  letter-spacing: 1px;
}

/* Mission HUD Card */
.mission-card {
  position: absolute;
  top: 75px;
  left: 16px;
  background: var(--bg-dark);
  border-left: 4px solid var(--primary-gold);
  padding: 12px 16px;
  border-radius: 6px;
  max-width: 320px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
  pointer-events: auto;
  backdrop-filter: blur(8px);
}
.mission-card.hidden {
  display: none;
}
.mission-card-header {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  font-weight: 700;
  margin-bottom: 4px;
}
.mission-badge {
  color: var(--primary-gold);
  letter-spacing: 1px;
}
.mission-timer {
  color: #ff5252;
}
.mission-title {
  font-family: var(--font-sub);
  font-weight: 700;
  font-size: 1.05rem;
  color: #fff;
}
.mission-desc {
  font-size: 0.8rem;
  color: #cfd8dc;
  margin: 4px 0 8px 0;
  line-height: 1.3;
}
.mission-progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #ffb300, #4caf50);
  transition: width 0.25s ease;
}
.mission-dist-text {
  font-size: 0.75rem;
  color: #90caf9;
  margin-top: 4px;
  text-align: right;
}

/* Implement Status Card */
.implement-card {
  position: absolute;
  bottom: 120px;
  left: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-dark);
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 10px 14px;
  border-radius: 8px;
  pointer-events: auto;
  backdrop-filter: blur(6px);
}
.impl-icon {
  font-size: 1.8rem;
}
.impl-name {
  font-family: var(--font-sub);
  font-weight: 700;
  font-size: 0.95rem;
  color: #fff;
}
.impl-state {
  font-size: 0.75rem;
  color: #ffd54f;
}

/* Dashboard Cluster (Bottom Center) */
.hud-dashboard {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: flex-end;
  gap: 18px;
  background: var(--bg-dark);
  border: 1px solid rgba(255, 255, 255, 0.18);
  padding: 12px 24px;
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
  pointer-events: auto;
  backdrop-filter: blur(8px);
}
.dash-dial {
  text-align: center;
}
.dial-label {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 1px;
  color: #90a4ae;
}
.dial-value {
  font-family: var(--font-display);
  font-size: 2.4rem;
  line-height: 1;
  font-weight: 600;
  color: #fff;
}
.dial-value .unit {
  font-size: 0.9rem;
  color: var(--primary-gold);
}
.dash-gear {
  font-family: var(--font-display);
  font-size: 1.4rem;
  color: var(--primary-gold);
  background: rgba(255, 179, 0, 0.15);
  border-radius: 4px;
  padding: 2px 8px;
  margin-top: 2px;
}
.dial-bar-bg {
  width: 80px;
  height: 6px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 4px;
}
.dial-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #4caf50, #ffb300, #f44336);
  transition: width 0.1s ease;
}
.dash-indicators {
  display: flex;
  gap: 8px;
  font-size: 1.25rem;
  padding-bottom: 6px;
}
.ind-icon {
  opacity: 0.25;
  transition: opacity 0.15s ease;
}

/* ==========================================
   MOBILE TOUCH CONTROLS
   ========================================== */
.mobile-controls-layer {
  position: absolute;
  bottom: 12px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 20px;
  pointer-events: none;
}
.mobile-left-cluster, .mobile-right-cluster {
  display: flex;
  gap: 12px;
  pointer-events: auto;
}
.mobile-center-actions {
  display: flex;
  gap: 8px;
  pointer-events: auto;
  margin-bottom: 95px; /* Above dashboard */
}
.touch-btn {
  background: rgba(20, 26, 36, 0.85);
  border: 2px solid rgba(255, 255, 255, 0.3);
  color: #fff;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-sub);
  font-weight: 700;
  cursor: pointer;
  touch-action: none;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
}
.touch-btn:active {
  background: var(--primary-gold);
  color: #111;
  transform: scale(0.95);
}
.steer-btn {
  width: 65px;
  height: 65px;
  font-size: 1.8rem;
}
.pedal-btn {
  width: 70px;
  height: 95px;
  flex-direction: column;
}
.pedal-icon {
  font-size: 1.5rem;
}
.pedal-label {
  font-size: 0.65rem;
  line-height: 1.1;
  text-align: center;
}
.gas-pedal {
  background: rgba(46, 125, 50, 0.85);
  border-color: #66bb6a;
}
.brake-pedal {
  background: rgba(198, 40, 40, 0.85);
  border-color: #ef5350;
}
.action-btn {
  background: var(--bg-dark);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  padding: 8px 12px;
  border-radius: 8px;
  font-family: var(--font-sub);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
}
.action-btn:active {
  background: var(--primary-gold);
  color: #111;
}

/* Toast Notifications */
.toast-notification {
  position: absolute;
  top: 75px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(0, 0, 0, 0.9);
  border: 1px solid var(--primary-gold);
  color: #fff;
  padding: 10px 22px;
  border-radius: 20px;
  font-family: var(--font-sub);
  font-weight: 600;
  font-size: 0.95rem;
  opacity: 0;
  transition: all 0.25s ease;
  pointer-events: none;
  box-shadow: 0 4px 16px rgba(255, 179, 0, 0.35);
  z-index: 100;
}
.toast-notification.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ==========================================
   MODAL WINDOWS (MISSIONS, SETTINGS, MAP)
   ========================================== */
.modal-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.78);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  backdrop-filter: blur(6px);
}
.modal-box {
  background: var(--panel-bg);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  width: 90%;
  max-width: 580px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
.modal-large {
  max-width: 820px;
}
.modal-header {
  padding: 18px 24px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header h2 {
  font-family: var(--font-display);
  font-size: 1.8rem;
  letter-spacing: 1px;
  color: var(--primary-gold);
}
.close-modal {
  background: transparent;
  border: none;
  color: #fff;
  font-size: 1.4rem;
  cursor: pointer;
}
.modal-body {
  padding: 20px 24px;
  overflow-y: auto;
}

/* Mission scroll list */
.mission-scroll-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.mission-item {
  display: flex;
  align-items: center;
  gap: 16px;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 14px 18px;
  border-radius: 8px;
}
.mission-item.completed {
  border-color: rgba(76, 175, 80, 0.6);
  background: rgba(46, 125, 50, 0.12);
}
.mission-num {
  font-family: var(--font-display);
  font-size: 1.8rem;
  color: var(--primary-gold);
  width: 40px;
}
.mission-details {
  flex: 1;
}
.mission-item-title {
  font-family: var(--font-sub);
  font-size: 1.1rem;
  font-weight: 700;
}
.mission-item-desc {
  font-size: 0.8rem;
  color: #b0bec5;
  margin: 4px 0;
}
.mission-item-rewards {
  display: flex;
  gap: 14px;
  font-size: 0.8rem;
  color: #ffd54f;
  font-weight: 600;
}
.btn-sm {
  padding: 8px 18px;
  font-size: 0.9rem;
}

/* Fullscreen Map */
.map-screen-body {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.map-grid-legend {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  width: 100%;
  font-size: 0.78rem;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.leg-color {
  width: 12px;
  height: 12px;
  border-radius: 3px;
}
.map-canvas-wrapper {
  background: #1b2e15;
  border: 2px solid var(--primary-gold);
  border-radius: 8px;
  overflow: hidden;
}
.map-note {
  font-size: 0.75rem;
  color: #b0bec5;
}

/* Garage Screen */
.garage-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.3);
  display: flex;
  flex-direction: column;
  pointer-events: auto;
  padding: 24px;
}
.garage-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.back-btn {
  background: var(--panel-bg);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  padding: 8px 16px;
  border-radius: 6px;
  font-family: var(--font-sub);
  font-weight: 700;
  cursor: pointer;
}
.garage-title {
  font-family: var(--font-display);
  font-size: 2.2rem;
  letter-spacing: 2px;
  color: var(--primary-gold);
}
.garage-wallet {
  font-family: var(--font-sub);
  font-size: 1.3rem;
  font-weight: 700;
  color: #ffd54f;
}
.garage-content {
  display: flex;
  justify-content: space-between;
  flex: 1;
}
.garage-card {
  width: 360px;
  background: var(--bg-dark);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 12px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  backdrop-filter: blur(8px);
}
.tractor-brand {
  font-size: 0.8rem;
  letter-spacing: 1.5px;
  color: var(--primary-gold);
  font-weight: 700;
}
.tractor-name {
  font-family: var(--font-display);
  font-size: 2.2rem;
  line-height: 1;
}
.tractor-desc {
  font-size: 0.82rem;
  color: #cfd8dc;
  line-height: 1.4;
}
.spec-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  background: rgba(0, 0, 0, 0.4);
  padding: 10px;
  border-radius: 6px;
  text-align: center;
}
.spec-lbl {
  display: block;
  font-size: 0.65rem;
  color: #90a4ae;
}
.spec-val {
  font-family: var(--font-sub);
  font-size: 0.95rem;
  font-weight: 700;
  color: #fff;
}
.tractor-tabs {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tab-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #fff;
  padding: 10px 14px;
  border-radius: 6px;
  font-family: var(--font-sub);
  font-weight: 700;
  text-align: left;
  display: flex;
  justify-content: space-between;
  cursor: pointer;
}
.tab-btn.active {
  border-color: var(--primary-gold);
  background: rgba(255, 179, 0, 0.18);
  color: var(--primary-gold);
}
.custom-section .section-title {
  font-size: 0.72rem;
  letter-spacing: 1px;
  color: #90a4ae;
  margin-bottom: 6px;
  font-weight: 700;
}
.color-palette {
  display: flex;
  gap: 8px;
}
.color-swatch, .rim-swatch {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.4);
  cursor: pointer;
  transition: transform 0.15s ease;
}
.color-swatch:hover, .rim-swatch:hover {
  transform: scale(1.15);
  border-color: #fff;
}
.garage-action-area {
  margin-top: auto;
}
.garage-hint {
  align-self: flex-end;
  background: rgba(0, 0, 0, 0.65);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 0.85rem;
}

/* Settings Controls */
.setting-group {
  margin-bottom: 20px;
}
.setting-group h3 {
  font-family: var(--font-sub);
  font-size: 1.1rem;
  color: var(--primary-gold);
  margin-bottom: 12px;
}
.slider-row, .toggle-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 0.9rem;
}
.slider-row input[type="range"] {
  width: 180px;
  accent-color: var(--primary-gold);
}
.toggle-row select {
  background: #222;
  color: #fff;
  padding: 6px 12px;

  <!-- Inline All Game Code (Audio, Physics, Models, World, Missions, UI, Engine) -->
  <script>
/**
 * INDIAN TRACTOR SIMULATOR 3D — UNIFIED BUNDLE
 * Works on both http://localhost and direct file:// protocol
 */
(function() {
  "use strict";

  // ==========================================
  // MODULE: audio.js
  // ==========================================
/**
 * Indian Tractor Simulator 3D - Procedural Web Audio Engine
 * Pure Web Audio API synthesis: zero external audio files needed.
 * Features realistic diesel tractor engine simulation, Punjabi pressure horn,
 * hydraulic hitch effects, ambient village environment, and UI sounds.
 */

class AudioManager {
  constructor() {
    this.ctx = null;
    this.initialized = false;
    this.isMuted = false;

    // Volume channels
    this.volumes = {
      master: 0.85,
      engine: 0.8,
      ambient: 0.5,
      effects: 0.9,
      ui: 0.7
    };

    // Gain nodes
    this.masterGain = null;
    this.engineGain = null;
    this.ambientGain = null;
    this.effectsGain = null;
    this.uiGain = null;

    // Engine synth state
    this.engineRunning = false;
    this.engineOsc1 = null;
    this.engineOsc2 = null;
    this.engineSubOsc = null;
    this.engineFilter = null;
    this.engineDistortion = null;
    this.currentRPM = 750;
    this.targetRPM = 750;
    this.engineLoad = 0;

    // Horn state
    this.hornOsc1 = null;
    this.hornOsc2 = null;
    this.hornGain = null;
    this.isHonking = false;

    // Ambient loop nodes
    this.ambientSource = null;
    this.rainGain = null;
    this.rainNoise = null;
  }

  init() {
    if (this.initialized) return;

    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      this.ctx = new AudioCtx();

      // Master bus
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.setValueAtTime(this.isMuted ? 0 : this.volumes.master, this.ctx.currentTime);
      this.masterGain.connect(this.ctx.destination);

      // Channel busses
      this.engineGain = this.ctx.createGain();
      this.engineGain.gain.setValueAtTime(this.volumes.engine, this.ctx.currentTime);
      this.engineGain.connect(this.masterGain);

      this.ambientGain = this.ctx.createGain();
      this.ambientGain.gain.setValueAtTime(this.volumes.ambient, this.ctx.currentTime);
      this.ambientGain.connect(this.masterGain);

      this.effectsGain = this.ctx.createGain();
      this.effectsGain.gain.setValueAtTime(this.volumes.effects, this.ctx.currentTime);
      this.effectsGain.connect(this.masterGain);

      this.uiGain = this.ctx.createGain();
      this.uiGain.gain.setValueAtTime(this.volumes.ui, this.ctx.currentTime);
      this.uiGain.connect(this.masterGain);

      this.initialized = true;
      this.startAmbient();
    } catch (e) {
      console.warn('Web Audio init error:', e);
    }
  }

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  setVolume(channel, val) {
    val = Math.max(0, Math.min(1, val));
    this.volumes[channel] = val;
    if (this.isMuted) return;

    const t = this.ctx ? this.ctx.currentTime : 0;
    if (channel === 'master' && this.masterGain) this.masterGain.gain.linearRampToValueAtTime(val, t + 0.05);
    if (channel === 'engine' && this.engineGain) this.engineGain.gain.linearRampToValueAtTime(val, t + 0.05);
    if (channel === 'ambient' && this.ambientGain) this.ambientGain.gain.linearRampToValueAtTime(val, t + 0.05);
    if (channel === 'effects' && this.effectsGain) this.effectsGain.gain.linearRampToValueAtTime(val, t + 0.05);
    if (channel === 'ui' && this.uiGain) this.uiGain.gain.linearRampToValueAtTime(val, t + 0.05);
  }

  setMute(mute) {
    this.isMuted = mute;
    if (!this.masterGain || !this.ctx) return;
    this.masterGain.gain.linearRampToValueAtTime(mute ? 0 : this.volumes.master, this.ctx.currentTime + 0.05);
  }

  // ==========================================
  // DIESEL TRACTOR ENGINE SOUND SYNTHESIS
  // ==========================================

  startEngine() {
    if (!this.initialized) this.init();
    if (!this.ctx || this.engineRunning) return;
    this.resume();

    const t = this.ctx.currentTime;

    // Cranking sound burst
    this.playCrankingSound();

    setTimeout(() => {
      if (!this.ctx) return;
      this.engineRunning = true;

      // 1. Primary cylinder firing oscillator (sawtooth for rich harmonics)
      this.engineOsc1 = this.ctx.createOscillator();
      this.engineOsc1.type = 'sawtooth';
      this.engineOsc1.frequency.setValueAtTime(26, this.ctx.currentTime); // ~750 RPM fundamental

      // 2. Secondary harmonic oscillator (triangle for low thud)
      this.engineOsc2 = this.ctx.createOscillator();
      this.engineOsc2.type = 'triangle';
      this.engineOsc2.frequency.setValueAtTime(52, this.ctx.currentTime);

      // 3. Sub-bass diesel thump oscillator
      this.engineSubOsc = this.ctx.createOscillator();
      this.engineSubOsc.type = 'sine';
      this.engineSubOsc.frequency.setValueAtTime(13, this.ctx.currentTime);

      // Wave shaper for diesel combustion grit
      this.engineDistortion = this.ctx.createWaveShaper();
      this.engineDistortion.curve = this.makeDistortionCurve(20);

      // Resonant low-pass filter
      this.engineFilter = this.ctx.createBiquadFilter();
      this.engineFilter.type = 'lowpass';
      this.engineFilter.frequency.setValueAtTime(180, this.ctx.currentTime);
      this.engineFilter.Q.setValueAtTime(4.0, this.ctx.currentTime);

      // Connect nodes
      this.engineOsc1.connect(this.engineDistortion);
      this.engineOsc2.connect(this.engineDistortion);
      this.engineSubOsc.connect(this.engineFilter);
      this.engineDistortion.connect(this.engineFilter);

      this.engineFilter.connect(this.engineGain);

      this.engineOsc1.start();
      this.engineOsc2.start();
      this.engineSubOsc.start();
    }, 450);
  }

  playCrankingSound() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'square';
    osc.frequency.setValueAtTime(14, t);
    osc.frequency.linearRampToValueAtTime(22, t + 0.4);

    gain.gain.setValueAtTime(0.4, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.45);

    osc.connect(gain);
    gain.connect(this.effectsGain);

    osc.start(t);
    osc.stop(t + 0.45);
  }

  stopEngine() {
    if (!this.engineRunning || !this.ctx) return;
    this.engineRunning = false;

    const t = this.ctx.currentTime;
    if (this.engineOsc1) {
      this.engineOsc1.frequency.exponentialRampToValueAtTime(8, t + 0.4);
      this.engineOsc1.stop(t + 0.45);
    }
    if (this.engineOsc2) {
      this.engineOsc2.frequency.exponentialRampToValueAtTime(16, t + 0.4);
      this.engineOsc2.stop(t + 0.45);
    }
    if (this.engineSubOsc) {
      this.engineSubOsc.stop(t + 0.45);
    }

    // Engine shut-down hiss/sputter
    setTimeout(() => {
      this.engineOsc1 = null;
      this.engineOsc2 = null;
      this.engineSubOsc = null;
      this.engineFilter = null;
      this.engineDistortion = null;
    }, 500);
  }

  updateEngine(rpm, load = 0) {
    if (!this.engineRunning || !this.ctx || !this.engineOsc1) return;

    this.currentRPM = rpm;
    this.engineLoad = load;

    // RPM 700 -> 2400 maps to firing frequency 22Hz -> 76Hz
    const baseFreq = (rpm / 60) * 1.8;
    const t = this.ctx.currentTime;

    this.engineOsc1.frequency.setTargetAtTime(baseFreq, t, 0.05);
    this.engineOsc2.frequency.setTargetAtTime(baseFreq * 2, t, 0.05);
    this.engineSubOsc.frequency.setTargetAtTime(baseFreq * 0.5, t, 0.05);

    // Filter cut-off opens with RPM and throttle load
    const filterFreq = 160 + (rpm - 700) * 0.45 + load * 220;
    this.engineFilter.frequency.setTargetAtTime(Math.min(1800, filterFreq), t, 0.06);

    // Subtle load distortion & gain bump
    const loadGain = 0.7 + (rpm / 2400) * 0.35 + load * 0.25;
    this.engineGain.gain.setTargetAtTime(loadGain * this.volumes.engine, t, 0.05);
  }

  makeDistortionCurve(amount) {
    const k = amount;
    const n = 44100;
    const curve = new Float32Array(n);
    const deg = Math.PI / 180;
    for (let i = 0; i < n; ++i) {
      const x = (i * 2) / n - 1;
      curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
    }
    return curve;
  }

  // ==========================================
  // INDIAN PRESSURE HORN (PUNJABI STYLE)
  // ==========================================

  startHorn(style = 'punjabi') {
    if (!this.initialized) this.init();
    if (!this.ctx || this.isHonking) return;
    this.resume();

    this.isHonking = true;
    const t = this.ctx.currentTime;

    this.hornOsc1 = this.ctx.createOscillator();
    this.hornOsc2 = this.ctx.createOscillator();
    this.hornGain = this.ctx.createGain();

    // Dual-tone harmonic brass frequencies (authentic Indian dual trumpet horn)
    if (style === 'punjabi') {
      this.hornOsc1.type = 'sawtooth';
      this.hornOsc2.type = 'sawtooth';
      this.hornOsc1.frequency.setValueAtTime(420, t); // G#4
      this.hornOsc2.frequency.setValueAtTime(525, t); // C5
      // Slight vibrato
      this.hornOsc1.frequency.linearRampToValueAtTime(440, t + 0.15);
      this.hornOsc2.frequency.linearRampToValueAtTime(550, t + 0.15);
    } else {
      // Standard electric farm horn
      this.hornOsc1.type = 'square';
      this.hornOsc2.type = 'sawtooth';
      this.hornOsc1.frequency.setValueAtTime(370, t);
      this.hornOsc2.frequency.setValueAtTime(460, t);
    }

    // Resonant bandpass for trumpet bell resonance
    const hornFilter = this.ctx.createBiquadFilter();
    hornFilter.type = 'bandpass';
    hornFilter.frequency.setValueAtTime(950, t);
    hornFilter.Q.setValueAtTime(2.2, t);

    this.hornGain.gain.setValueAtTime(0, t);
    this.hornGain.gain.linearRampToValueAtTime(0.85, t + 0.04);

    this.hornOsc1.connect(hornFilter);
    this.hornOsc2.connect(hornFilter);
    hornFilter.connect(this.hornGain);
    this.hornGain.connect(this.effectsGain);

    this.hornOsc1.start(t);
    this.hornOsc2.start(t);
  }

  stopHorn() {
    if (!this.isHonking || !this.ctx || !this.hornGain) return;
    const t = this.ctx.currentTime;
    this.hornGain.gain.linearRampToValueAtTime(0, t + 0.06);

    setTimeout(() => {
      if (this.hornOsc1) {
        this.hornOsc1.stop();
        this.hornOsc1 = null;
      }
      if (this.hornOsc2) {
        this.hornOsc2.stop();
        this.hornOsc2 = null;
      }
      this.hornGain = null;
      this.isHonking = false;
    }, 70);
  }

  // ==========================================
  // MECHANICAL & FARMING SOUND EFFECTS
  // ==========================================

  playGearShift() {
    if (!this.initialized || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(160, t);
    osc.frequency.exponentialRampToValueAtTime(70, t + 0.09);

    gain.gain.setValueAtTime(0.5, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);

    osc.connect(gain);
    gain.connect(this.effectsGain);
    osc.start(t);
    osc.stop(t + 0.1);
  }

  playHitchSound(attach = true) {
    if (!this.initialized || !this.ctx) return;
    const t = this.ctx.currentTime;

    // Metallic heavy clank
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(attach ? 280 : 360, t);
    osc.frequency.exponentialRampToValueAtTime(attach ? 80 : 120, t + 0.18);

    gain.gain.setValueAtTime(0.7, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);

    osc.connect(gain);
    gain.connect(this.effectsGain);
    osc.start(t);
    osc.stop(t + 0.22);
  }

  playBrakeSqueal() {
    if (!this.initialized || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(2200, t);
    osc.frequency.linearRampToValueAtTime(1800, t + 0.25);

    gain.gain.setValueAtTime(0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.26);

    osc.connect(gain);
    gain.connect(this.effectsGain);
    osc.start(t);
    osc.stop(t + 0.27);
  }

  playTireDirtRoll(speed) {
    // Speed-dependent rumble
    if (!this.initialized || !this.ctx || speed < 1) return;
    // handled dynamically in physics loop
  }

  // ==========================================
  // AMBIENT VILLAGE & WEATHER SOUNDS
  // ==========================================

  startAmbient() {
    if (!this.ctx) return;

    // Procedural rural wind & soft foliage rustle
    const bufferSize = this.ctx.sampleRate * 2;
    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }

    const whiteNoise = this.ctx.createBufferSource();
    whiteNoise.buffer = noiseBuffer;
    whiteNoise.loop = true;

    // Filter to soft warm village breeze
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(320, this.ctx.currentTime);
    filter.Q.setValueAtTime(0.7, this.ctx.currentTime);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);

    whiteNoise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ambientGain);

    whiteNoise.start();
  }

  setRainSound(isRaining) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;

    if (isRaining && !this.rainNoise) {
      const bufferSize = this.ctx.sampleRate * 2;
      const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = (Math.random() * 2 - 1) * 0.8;
      }

      this.rainNoise = this.ctx.createBufferSource();
      this.rainNoise.buffer = noiseBuffer;
      this.rainNoise.loop = true;

      const rainFilter = this.ctx.createBiquadFilter();
      rainFilter.type = 'lowpass';
      rainFilter.frequency.setValueAtTime(1100, t);

      this.rainGain = this.ctx.createGain();
      this.rainGain.gain.setValueAtTime(0, t);
      this.rainGain.gain.linearRampToValueAtTime(0.4, t + 1.0);

      this.rainNoise.connect(rainFilter);
      rainFilter.connect(this.rainGain);
      this.rainGain.connect(this.ambientGain);

      this.rainNoise.start();
    } else if (!isRaining && this.rainGain) {
      this.rainGain.gain.linearRampToValueAtTime(0, t + 1.0);
      setTimeout(() => {
        if (this.rainNoise) {
          this.rainNoise.stop();
          this.rainNoise = null;
          this.rainGain = null;
        }
      }, 1050);
    }
  }

  playVillageBirdChirp() {
    if (!this.ctx || this.isMuted) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(2600, t);
    osc.frequency.exponentialRampToValueAtTime(4200, t + 0.08);
    osc.frequency.exponentialRampToValueAtTime(3100, t + 0.16);

    gain.gain.setValueAtTime(0.08, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);

    osc.connect(gain);
    gain.connect(this.ambientGain);
    osc.start(t);
    osc.stop(t + 0.19);
  }

  // ==========================================
  // UI & MISSION FANFARE SOUNDS
  // ==========================================

  playUIClick() {
    if (!this.initialized) this.init();
    if (!this.ctx || this.isMuted) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(580, t);
    osc.frequency.exponentialRampToValueAtTime(280, t + 0.05);

    gain.gain.setValueAtTime(0.3, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.06);

    osc.connect(gain);
    gain.connect(this.uiGain);
    osc.start(t);
    osc.stop(t + 0.06);
  }

  playMissionSuccess() {
    if (!this.initialized) this.init();
    if (!this.ctx || this.isMuted) return;

    // Victory fanfare notes: C5, E5, G5, C6 (classic reward chord)
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      const t = this.ctx.currentTime + idx * 0.12;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);

      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.4, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);

      osc.connect(gain);
      gain.connect(this.uiGain);
      osc.start(t);
      osc.stop(t + 0.5);
    });
  }
}


  // ==========================================
  // MODULE: physics.js
  // ==========================================
/**
 * Indian Tractor Simulator 3D - Vehicle Physics & Trailer Articulation Engine
 * Provides stable, realistic, responsive tractor driving physics,
 * surface-dependent friction, gear ratios, speed-sensitive steering,
 * articulated trailer towing mechanics, and tractor recovery.
 */

class VehiclePhysics {
  constructor() {
    // Position & Orientation
    this.x = 0;
    this.y = 0.9; // ground clearance
    this.z = 0;
    this.heading = 0; // Yaw angle in radians (0 = along +Z or -Z)
    this.pitch = 0;
    this.roll = 0;

    // Velocities
    this.speed = 0; // m/s
    this.angularVelocity = 0;
    this.wheelSpeed = 0;

    // Steering
    this.steerAngle = 0; // radians (-0.6 to +0.6)
    this.targetSteerAngle = 0;
    this.maxSteerAngle = 0.58; // ~33 degrees
    this.steerSpeed = 2.8;

    // Engine & Transmission
    this.engineOn = true;
    this.currentGear = 1; // 1, 2, 3, 4, -1 (Reverse), 0 (Neutral)
    this.gearRatios = {
      '-1': -4.2, // Reverse
      '0': 0,     // Neutral
      '1': 6.5,   // Heavy low gear (tilling / pulling)
      '2': 4.2,   // Farm work gear
      '3': 2.8,   // Road transit
      '4': 1.8    // Highway cruising (top speed ~36 km/h)
    };
    this.gearMaxSpeeds = {
      '-1': 3.2,  // ~11 km/h
      '0': 0,
      '1': 3.0,   // ~10 km/h
      '2': 5.5,   // ~20 km/h
      '3': 7.5,   // ~27 km/h
      '4': 10.2   // ~36.7 km/h
    };
    this.rpm = 750;
    this.idleRPM = 750;
    this.maxRPM = 2400;
    this.throttle = 0;
    this.brake = 0;
    this.handbrake = false;

    // Surface detection & friction
    this.currentSurface = 'road'; // 'road', 'dirt', 'mud', 'grass', 'field'
    this.surfaceGrip = 1.0;
    this.surfaceResistance = 1.0;

    // Tractor Dimensions
    this.wheelbase = 2.2; // distance between front and rear axle
    this.frontTrack = 1.4;
    this.rearTrack = 1.6;
    this.frontWheelRadius = 0.45;
    this.rearWheelRadius = 0.78;

    // Wheel rotation state for visual meshes
    this.frontWheelRotation = 0;
    this.rearWheelRotation = 0;
    this.steeringWheelRotation = 0;

    // Hitch point relative to tractor center (rear hitch)
    this.hitchOffset = -1.65; // 1.65m behind tractor center

    // Trailer / Trolley Articulation
    this.trolleyAttached = false;
    this.trolleyX = 0;
    this.trolleyY = 0.85;
    this.trolleyZ = 0;
    this.trolleyHeading = 0;
    this.trolleyDrawbarLength = 2.4; // Distance from tractor hitch to trolley axle
    this.trolleyWheelRadius = 0.55;
    this.trolleyWheelRotation = 0;
    this.trolleyCargoCount = 0; // Wheat bags or sugarcane
    this.trolleyMaxCargo = 10;
    this.trolleyTippingProgress = 0; // 0 to 1 for tipping unload animation

    // Farming Implement (Cultivator / Plough)
    this.implementAttached = null; // 'cultivator', 'plough', 'seed_drill'
    this.implementLowered = false; // Raised (transport) vs Lowered (working)
    this.implementProgress = 0; // 0 (up) to 1 (down)

    // Boundaries & Ground collision
    this.worldBounds = 280; // 560m x 560m world
  }

  reset(x = 0, z = 0, heading = 0) {
    this.x = x;
    this.y = 0.9;
    this.z = z;
    this.heading = heading;
    this.pitch = 0;
    this.roll = 0;
    this.speed = 0;
    this.angularVelocity = 0;
    this.steerAngle = 0;
    this.targetSteerAngle = 0;
    this.rpm = this.idleRPM;
    this.handbrake = false;

    if (this.trolleyAttached) {
      // Position trolley directly behind tractor
      const hitchX = this.x - Math.sin(this.heading) * this.hitchOffset;
      const hitchZ = this.z - Math.cos(this.heading) * this.hitchOffset;
      this.trolleyHeading = this.heading;
      this.trolleyX = hitchX - Math.sin(this.trolleyHeading) * this.trolleyDrawbarLength;
      this.trolleyZ = hitchZ - Math.cos(this.trolleyHeading) * this.trolleyDrawbarLength;
    }
  }

  update(dt, inputs, getTerrainHeight, getSurfaceType) {
    if (dt > 0.1) dt = 0.1; // clamp delta to prevent physics explosion

    // 1. Process Inputs
    this.throttle = inputs.accelerate ? 1 : 0;
    this.brake = inputs.brake ? 1 : 0;
    this.handbrake = !!inputs.handbrake;

    // Steering input with speed dampening
    let steerDir = 0;
    if (inputs.steerLeft) steerDir += 1;
    if (inputs.steerRight) steerDir -= 1;
    if (inputs.steeringSlider !== undefined) {
      steerDir = inputs.steeringSlider; // analog control (-1 to +1)
    }

    // High speed reduces maximum steering sensitivity for stability
    const speedRatio = Math.min(1, Math.abs(this.speed) / 8.0);
    const effectiveMaxSteer = this.maxSteerAngle * (1.0 - speedRatio * 0.42);

    this.targetSteerAngle = steerDir * effectiveMaxSteer;

    // Smooth steering interpolation
    const steerStep = this.steerSpeed * dt;
    if (this.steerAngle < this.targetSteerAngle) {
      this.steerAngle = Math.min(this.targetSteerAngle, this.steerAngle + steerStep);
    } else if (this.steerAngle > this.targetSteerAngle) {
      this.steerAngle = Math.max(this.targetSteerAngle, this.steerAngle - steerStep);
    }

    this.steeringWheelRotation = this.steerAngle * 4.2; // ~2.5 turns

    // 2. Surface Properties
    if (getSurfaceType) {
      this.currentSurface = getSurfaceType(this.x, this.z);
    }
    this.updateSurfacePhysics();

    // 3. Implement Resistance
    let implementDrag = 0;
    if (this.implementAttached && this.implementLowered) {
      implementDrag = 0.35; // Cultivating soil creates realistic engine drag
      this.implementProgress = Math.min(1, this.implementProgress + dt * 2.5);
    } else {
      this.implementProgress = Math.max(0, this.implementProgress - dt * 2.5);
    }

    // 4. Cargo Weight Influence
    const cargoWeightFactor = 1.0 + (this.trolleyAttached ? 0.3 + (this.trolleyCargoCount / this.trolleyMaxCargo) * 0.45 : 0);

    // 5. Automatic Gear Selection & RPM calculation
    if (this.engineOn) {
      if (this.brake > 0 && this.speed <= 0.1) {
        // Shift to Reverse if stopped and holding brake
        this.currentGear = -1;
      } else if (this.throttle > 0 && this.currentGear === -1 && this.speed >= -0.1) {
        this.currentGear = 1;
      } else if (this.currentGear > 0) {
        // Auto forward shifting based on speed
        const absSpd = Math.abs(this.speed);
        if (absSpd > 7.0) this.currentGear = 4;
        else if (absSpd > 4.5) this.currentGear = 3;
        else if (absSpd > 2.2) this.currentGear = 2;
        else this.currentGear = 1;
      }
    } else {
      this.currentGear = 0;
    }

    // 6. Acceleration and Braking Forces
    let driveForce = 0;
    const maxSpeed = this.gearMaxSpeeds[this.currentGear] || 0;

    if (this.engineOn) {
      if (this.currentGear > 0 && this.throttle > 0) {
        // Forward drive
        const torque = (1.0 - Math.abs(this.speed) / maxSpeed) * 3.8;
        driveForce = Math.max(0, torque) * this.surfaceGrip / cargoWeightFactor;
      } else if (this.currentGear === -1 && this.brake > 0) {
        // Reverse drive
        const torque = (1.0 - Math.abs(this.speed) / maxSpeed) * 2.8;
        driveForce = -Math.max(0, torque) * this.surfaceGrip / cargoWeightFactor;
      }
    }

    // Braking force
    let brakingForce = 0;
    if (this.currentGear > 0 && this.brake > 0) {
      brakingForce = 7.5; // active foot brake
    } else if (this.currentGear === -1 && this.throttle > 0) {
      brakingForce = 7.5; // braking while reversing
    }
    if (this.handbrake) {
      brakingForce += 12.0; // strong handbrake lock
    }

    // Rolling friction & aerodynamic / soil drag
    const rollingResistance = (0.45 * this.surfaceResistance + implementDrag) * (this.speed > 0 ? 1 : (this.speed < 0 ? -1 : 0));

    // Net acceleration
    let accel = driveForce;
    if (Math.abs(this.speed) > 0.05) {
      const brakeDecel = (brakingForce + Math.abs(rollingResistance)) * Math.sign(this.speed);
      accel -= brakeDecel;
    } else if (driveForce === 0) {
      this.speed = 0;
      accel = 0;
    }

    this.speed += accel * dt;

    // Clamp speed to gear limits
    if (this.currentGear > 0) {
      this.speed = Math.max(0, Math.min(maxSpeed, this.speed));
    } else if (this.currentGear === -1) {
      this.speed = Math.max(-maxSpeed, Math.min(0, this.speed));
    } else {
      // Natural coasting
      this.speed *= Math.max(0, 1 - dt * 1.5);
    }

    // RPM Dynamics
    if (!this.engineOn) {
      this.rpm = Math.max(0, this.rpm - dt * 900);
    } else {
      const targetRPM = this.idleRPM + (Math.abs(this.speed) / (maxSpeed || 1)) * 1400 + (this.throttle > 0 ? 350 : 0);
      this.rpm += (targetRPM - this.rpm) * Math.min(1, dt * 6.0);
      this.rpm = Math.max(this.idleRPM, Math.min(this.maxRPM, this.rpm));
    }

    // 7. Steering & Bicycle Model Heading Update
    if (Math.abs(this.speed) > 0.01) {
      // Turning radius R = wheelbase / tan(steerAngle)
      // Angular velocity omega = (speed / wheelbase) * tan(steerAngle)
      const angularVel = (this.speed / this.wheelbase) * Math.tan(this.steerAngle);
      this.heading += angularVel * dt;

      // Integrate world position
      this.x += Math.sin(this.heading) * this.speed * dt;
      this.z += Math.cos(this.heading) * this.speed * dt;
    }

    // Clamp to world boundaries
    this.x = Math.max(-this.worldBounds, Math.min(this.worldBounds, this.x));
    this.z = Math.max(-this.worldBounds, Math.min(this.worldBounds, this.z));

    // Terrain height sampling & suspension tilt
    if (getTerrainHeight) {
      const groundY = getTerrainHeight(this.x, this.z);
      this.y = groundY + 0.88;

      // Sample points ahead and behind to estimate pitch
      const frontX = this.x + Math.sin(this.heading) * (this.wheelbase * 0.5);
      const frontZ = this.z + Math.cos(this.heading) * (this.wheelbase * 0.5);
      const rearX = this.x - Math.sin(this.heading) * (this.wheelbase * 0.5);
      const rearZ = this.z - Math.cos(this.heading) * (this.wheelbase * 0.5);

      const frontH = getTerrainHeight(frontX, frontZ);
      const rearH = getTerrainHeight(rearX, rearZ);
      const targetPitch = Math.atan2(frontH - rearH, this.wheelbase);
      this.pitch += (targetPitch - this.pitch) * Math.min(1, dt * 8.0);
    }

    // 8. Visual Wheel Rotation
    const travelDist = this.speed * dt;
    this.frontWheelRotation += travelDist / this.frontWheelRadius;
    this.rearWheelRotation += travelDist / this.rearWheelRadius;

    // 9. Articulated Trolley Dynamics
    if (this.trolleyAttached) {
      this.updateTrolleyPhysics(dt, getTerrainHeight);
    }
  }

  updateSurfacePhysics() {
    switch (this.currentSurface) {
      case 'road':
        this.surfaceGrip = 1.0;
        this.surfaceResistance = 0.35;
        break;
      case 'dirt':
        this.surfaceGrip = 0.82;
        this.surfaceResistance = 0.65;
        break;
      case 'mud':
        this.surfaceGrip = 0.48;
        this.surfaceResistance = 1.8;
        break;
      case 'field':
        this.surfaceGrip = 0.68;
        this.surfaceResistance = 1.25;
        break;
      case 'grass':
      default:
        this.surfaceGrip = 0.75;
        this.surfaceResistance = 0.75;
        break;
    }
  }

  updateTrolleyPhysics(dt, getTerrainHeight) {
    // Exact rear hitch location in world space
    const hitchX = this.x - Math.sin(this.heading) * this.hitchOffset;
    const hitchZ = this.z - Math.cos(this.heading) * this.hitchOffset;

    // Vector from trolley axle to tractor hitch
    const dx = hitchX - this.trolleyX;
    const dz = hitchZ - this.trolleyZ;
    const dist = Math.hypot(dx, dz);

    if (dist > 0.001) {
      // Target angle points directly towards the hitch pin
      const targetHeading = Math.atan2(dx, dz);

      // Smooth trailer rotational lag
      let diff = targetHeading - this.trolleyHeading;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;

      // Realistic articulation stiffness
      const turnRate = Math.min(1, Math.max(0.15, Math.abs(this.speed) * 0.45));
      this.trolleyHeading += diff * Math.min(1, dt * 8.0 * turnRate);

      // Distance constraint: keep trolley center exactly at drawbar distance behind hitch
      this.trolleyX = hitchX - Math.sin(this.trolleyHeading) * this.trolleyDrawbarLength;
      this.trolleyZ = hitchZ - Math.cos(this.trolleyHeading) * this.trolleyDrawbarLength;
    }

    if (getTerrainHeight) {
      this.trolleyY = getTerrainHeight(this.trolleyX, this.trolleyZ) + 0.85;
    }

    // Trolley wheel rotation
    this.trolleyWheelRotation += (this.speed * dt) / this.trolleyWheelRadius;
  }

  attachTrolley() {
    this.trolleyAttached = true;
    const hitchX = this.x - Math.sin(this.heading) * this.hitchOffset;
    const hitchZ = this.z - Math.cos(this.heading) * this.hitchOffset;
    this.trolleyHeading = this.heading;
    this.trolleyX = hitchX - Math.sin(this.trolleyHeading) * this.trolleyDrawbarLength;
    this.trolleyZ = hitchZ - Math.cos(this.trolleyHeading) * this.trolleyDrawbarLength;
  }

  detachTrolley() {
    this.trolleyAttached = false;
  }

  toggleEquipmentLower() {
    if (this.implementAttached) {
      this.implementLowered = !this.implementLowered;
      return this.implementLowered;
    }
    return false;
  }
}

    steerColumnGeo.rotateX(Math.PI / 4);
    const steerColumn = new THREE.Mesh(steerColumnGeo, this.materials.ironDark);
    steerColumn.position.set(0, 1.05, -0.42);

    const steeringWheelGroup = new THREE.Group();
    const wheelRimGeo = new THREE.TorusGeometry(0.22, 0.025, 8, 20);
    const wheelRim = new THREE.Mesh(wheelRimGeo, this.materials.rubber);
    const wheelHubGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.04, 12);
    wheelHubGeo.rotateX(Math.PI / 2);
    const wheelHub = new THREE.Mesh(wheelHubGeo, this.materials.ironDark);
    steeringWheelGroup.add(wheelRim, wheelHub);
    steeringWheelGroup.position.set(0, 1.28, -0.58);
    steeringWheelGroup.rotation.x = -Math.PI / 4;
    cockpitGroup.add(steerColumn, steeringWheelGroup);

    // Gear Shifter Levers
    const gearStickGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.35, 8);
    const gearStick = new THREE.Mesh(gearStickGeo, this.materials.chrome);
    gearStick.position.set(0.18, 0.55, -0.55);
    const gearKnobGeo = new THREE.SphereGeometry(0.035, 8, 8);
    const gearKnob = new THREE.Mesh(gearKnobGeo, this.materials.rubber);
    gearKnob.position.set(0.18, 0.72, -0.55);
    cockpitGroup.add(gearStick, gearKnob);

    root.add(cockpitGroup);

    // 8. Rear Wheel Mudguards (Fenders)
    const leftFenderGroup = new THREE.Group();
    const fenderShape = new THREE.BoxGeometry(0.42, 0.8, 1.55);
    const leftFender = new THREE.Mesh(fenderShape, fenderMat);
    leftFender.position.set(-0.85, 0.95, -1.0);
    leftFender.castShadow = true;
    leftFenderGroup.add(leftFender);

    // Grab handle on fender
    const handleGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.45, 8);
    const leftHandle = new THREE.Mesh(handleGeo, this.materials.chrome);
    leftHandle.position.set(-0.95, 1.38, -0.9);
    leftFenderGroup.add(leftHandle);

    const rightFenderGroup = new THREE.Group();
    const rightFender = new THREE.Mesh(fenderShape, fenderMat);
    rightFender.position.set(0.85, 0.95, -1.0);
    rightFender.castShadow = true;
    const rightHandle = leftHandle.clone();
    rightHandle.position.x = 0.95;
    rightFenderGroup.add(rightFender, rightHandle);

    root.add(leftFenderGroup, rightFenderGroup);

    // 9. Traditional Indian Canopy (Chhatri)
    if (cfg.canopy) {
      const canopyGroup = new THREE.Group();
      // 4 Upright chrome support poles
      const poleGeo = new THREE.CylinderGeometry(0.03, 0.03, 1.5, 8);
      const flPole = new THREE.Mesh(poleGeo, this.materials.chrome);
      flPole.position.set(-0.55, 1.25, -0.15);
      const frPole = flPole.clone();
      frPole.position.x = 0.55;
      const rlPole = flPole.clone();
      rlPole.position.set(-0.55, 1.25, -1.35);
      const rrPole = rlPole.clone();
      rrPole.position.x = 0.55;
      canopyGroup.add(flPole, frPole, rlPole, rrPole);

      // Canopy Roof Canvas
      const roofGeo = new THREE.BoxGeometry(1.35, 0.06, 1.6);
      const roofMat = new THREE.MeshStandardMaterial({
        color: cfg.bodyColor === 0x0d47a1 ? 0xffffff : 0xffb300,
        roughness: 0.8
      });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.set(0, 2.02, -0.75);
      roof.castShadow = true;
      canopyGroup.add(roof);

      // Frill border
      const frillGeo = new THREE.BoxGeometry(1.36, 0.12, 1.61);
      const frillMat = new THREE.MeshStandardMaterial({ color: 0xb71c1c });
      const frill = new THREE.Mesh(frillGeo, frillMat);
      frill.position.set(0, 1.95, -0.75);
      canopyGroup.add(frill);

      root.add(canopyGroup);
    }

    // 10. Rear 3-Point Hydraulic Hitch & Tow Drawbar
    const hitchGroup = new THREE.Group();
    const drawbarGeo = new THREE.BoxGeometry(0.12, 0.08, 0.65);
    const drawbar = new THREE.Mesh(drawbarGeo, this.materials.ironDark);
    drawbar.position.set(0, 0.12, -1.55);
    const hitchPinGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.15, 8);
    const hitchPin = new THREE.Mesh(hitchPinGeo, this.materials.chrome);
    hitchPin.position.set(0, 0.22, -1.72);
    hitchGroup.add(drawbar, hitchPin);
    root.add(hitchGroup);

    // 11. WHEELS
    // Front Wheels (Steerable)
    const frontWheelRadius = 0.45;
    const frontWheelWidth = 0.26;
    const frontLeftWheelGroup = this.createWheel(frontWheelRadius, frontWheelWidth, rimMat, 'ribbed');
    frontLeftWheelGroup.root.position.set(-0.72, -0.12, 1.15);

    const frontRightWheelGroup = this.createWheel(frontWheelRadius, frontWheelWidth, rimMat, 'ribbed');
    frontRightWheelGroup.root.position.set(0.72, -0.12, 1.15);

    // Rear Wheels (Huge Agricultural Deep Lug)
    const rearWheelRadius = 0.78;
    const rearWheelWidth = 0.48;
    const rearLeftWheelGroup = this.createWheel(rearWheelRadius, rearWheelWidth, rimMat, 'agri_lug');
    rearLeftWheelGroup.root.position.set(-0.88, 0.05, -1.05);

    const rearRightWheelGroup = this.createWheel(rearWheelRadius, rearWheelWidth, rimMat, 'agri_lug');
    rearRightWheelGroup.root.position.set(0.88, 0.05, -1.05);

    root.add(frontLeftWheelGroup.root, frontRightWheelGroup.root, rearLeftWheelGroup.root, rearRightWheelGroup.root);

    return {
      root,
      config: cfg,
      frontLeftWheel: frontLeftWheelGroup,
      frontRightWheel: frontRightWheelGroup,
      rearLeftWheel: rearLeftWheelGroup,
      rearRightWheel: rearRightWheelGroup,
      steeringWheel: steeringWheelGroup,
      exhaust: exhaustGroup,
      flapper,
      headlights: {
        group: headlightGroup,
        leftLens,
        rightLens,
        leftSpot,
        rightSpot
      },
      taillights: {
        left: leftTail,
        right: rightTail
      },
      hitchPoint: hitchPin
    };
  }

  // ==========================================
  // WHEEL BUILDER (AGRI LUG TREADS & RIMS)
  // ==========================================

  createWheel(radius, width, rimMat, treadType = 'agri_lug') {
    const THREE = this.THREE;
    const wheelGroup = new THREE.Group();

    // Pivot group for steering
    const steerGroup = new THREE.Group();
    // Spin group for rolling rotation
    const spinGroup = new THREE.Group();

    // Tire outer cylinder
    const tireGeo = new THREE.CylinderGeometry(radius, radius, width, 24);
    tireGeo.rotateZ(Math.PI / 2);
    const tire = new THREE.Mesh(tireGeo, this.materials.rubber);
    tire.castShadow = true;
    spinGroup.add(tire);

    // Rim
    const rimRadius = radius * 0.58;
    const rimGeo = new THREE.CylinderGeometry(rimRadius, rimRadius, width + 0.02, 18);
    rimGeo.rotateZ(Math.PI / 2);
    const rim = new THREE.Mesh(rimGeo, rimMat);
    spinGroup.add(rim);

    // Wheel Hub & Lug Nuts
    const hubGeo = new THREE.CylinderGeometry(rimRadius * 0.42, rimRadius * 0.42, width + 0.06, 12);
    hubGeo.rotateZ(Math.PI / 2);
    const hub = new THREE.Mesh(hubGeo, this.materials.ironDark);
    spinGroup.add(hub);

    // Agricultural Deep V-Lugs on tire tread (Authentic Indian Tractor Treads)
    if (treadType === 'agri_lug') {
      const lugCount = 14;
      const lugGeo = new THREE.BoxGeometry(width * 0.88, 0.08, 0.07);
      for (let i = 0; i < lugCount; i++) {
        const angle = (i / lugCount) * Math.PI * 2;
        const lug = new THREE.Mesh(lugGeo, this.materials.tread);
        lug.position.set(0, Math.sin(angle) * (radius + 0.02), Math.cos(angle) * (radius + 0.02));
        lug.rotation.x = angle + (i % 2 === 0 ? 0.28 : -0.28);
        spinGroup.add(lug);
      }
    }

    steerGroup.add(spinGroup);
    wheelGroup.add(steerGroup);

    return {
      root: wheelGroup,
      steer: steerGroup,
      spin: spinGroup
    };
  }

  // ==========================================
  // INDIAN TRACTOR TROLLEY (DESI TRAALI)
  // ==========================================

  createTrolley() {
    const THREE = this.THREE;
    const root = new THREE.Group();

    // 1. Steel Chassis & Leaf Springs
    const chassisGeo = new THREE.BoxGeometry(1.6, 0.2, 3.8);
    const chassis = new THREE.Mesh(chassisGeo, this.materials.trolleyChassis);
    chassis.position.set(0, 0, 0);
    chassis.castShadow = true;
    root.add(chassis);

    // Triangular Tow Drawbar (A-frame)
    const drawbarGroup = new THREE.Group();
    const barGeo = new THREE.CylinderGeometry(0.045, 0.045, 2.1, 10);
    const leftBar = new THREE.Mesh(barGeo, this.materials.trolleyChassis);
    leftBar.position.set(-0.35, 0.02, 2.3);
    leftBar.rotation.set(Math.PI / 2, 0, -0.22);
    const rightBar = leftBar.clone();
    rightBar.position.x = 0.35;
    rightBar.rotation.set(Math.PI / 2, 0, 0.22);

    // Swivel Hitch Eyelet ring
    const eyeletGeo = new THREE.TorusGeometry(0.08, 0.025, 8, 16);
    eyeletGeo.rotateX(Math.PI / 2);
    const eyelet = new THREE.Mesh(eyeletGeo, this.materials.chrome);
    eyelet.position.set(0, 0.02, 3.25);
    drawbarGroup.add(leftBar, rightBar, eyelet);
    root.add(drawbarGroup);

    // 2. Cargo Bed (Tippable group)
    const bedGroup = new THREE.Group();
    bedGroup.position.set(0, 0.15, -0.6); // Pivot point near rear axle

    // Bed Floor
    const bedFloorGeo = new THREE.BoxGeometry(1.9, 0.08, 3.6);
    const bedFloor = new THREE.Mesh(bedFloorGeo, this.materials.trolleyWood);
    bedFloor.position.set(0, 0, 0.6);
    bedFloor.castShadow = true;
    bedGroup.add(bedFloor);

    // Sideboards with Indian Truck Art styling
    const sideGeo = new THREE.BoxGeometry(0.08, 0.75, 3.6);
    const leftSide = new THREE.Mesh(sideGeo, this.materials.trolleyPaintBlue);
    leftSide.position.set(-0.95, 0.38, 0.6);
    leftSide.castShadow = true;
    const rightSide = leftSide.clone();
    rightSide.position.x = 0.95;

    // Front Board
    const frontGeo = new THREE.BoxGeometry(1.9, 0.75, 0.08);
    const frontBoard = new THREE.Mesh(frontGeo, this.materials.trolleyPaintBlue);
    frontBoard.position.set(0, 0.38, 2.4);

    // Rear Tailgate (Hinged at top)
    const rearGeo = new THREE.BoxGeometry(1.9, 0.75, 0.08);
    const rearBoard = new THREE.Mesh(rearGeo, this.materials.trolleyPaintBlue);
    rearBoard.position.set(0, 0.38, -1.2);

    bedGroup.add(leftSide, rightSide, frontBoard, rearBoard);

    // Cargo Container Group (holds sacks / sugarcane)
    const cargoGroup = new THREE.Group();
    cargoGroup.position.set(0, 0.1, 0.6);
    bedGroup.add(cargoGroup);

    root.add(bedGroup);

    // 3. Dual Rear Wheels
    const wheelRadius = 0.55;
    const wheelWidth = 0.32;
    const leftTrolleyWheel = this.createWheel(wheelRadius, wheelWidth, this.materials.rimRed, 'agri_lug');
    leftTrolleyWheel.root.position.set(-1.05, -0.25, -0.6);
    const rightTrolleyWheel = this.createWheel(wheelRadius, wheelWidth, this.materials.rimRed, 'agri_lug');
    rightTrolleyWheel.root.position.set(1.05, -0.25, -0.6);

    root.add(leftTrolleyWheel.root, rightTrolleyWheel.root);

    return {
      root,
      bedGroup,
      cargoGroup,
      leftWheel: leftTrolleyWheel,
      rightWheel: rightTrolleyWheel,
      hitchEyelet: eyelet
    };
  }

  // ==========================================
  // CARGO CREATION (WHEAT SACKS / SUGARCANE)
  // ==========================================

  createCargoLoad(type = 'wheat', count = 10) {
    const THREE = this.THREE;
    const group = new THREE.Group();

    if (type === 'wheat') {
      // Burlap Jute sacks neatly stacked
      const sackGeo = new THREE.BoxGeometry(0.55, 0.25, 0.85);
      let idx = 0;
      for (let layer = 0; layer < 2 && idx < count; layer++) {
        for (let row = 0; row < 3 && idx < count; row++) {
          for (let col = 0; col < 2 && idx < count; col++) {
            const sack = new THREE.Mesh(sackGeo, this.materials.juteSack);
            sack.position.set((col - 0.5) * 0.65, layer * 0.28 + 0.14, (row - 1) * 0.95);
            sack.rotation.y = (Math.random() - 0.5) * 0.1;
            sack.castShadow = true;
            group.add(sack);
            idx++;
          }
        }
      }
    } else if (type === 'sugarcane') {
      // Dense bundles of green/purple sugarcane stalks
      const bundleGeo = new THREE.CylinderGeometry(0.18, 0.18, 3.2, 8);
      bundleGeo.rotateX(Math.PI / 2);
      for (let i = 0; i < Math.min(count, 12); i++) {
        const bundle = new THREE.Mesh(bundleGeo, this.materials.sugarcane);
        bundle.position.set(((i % 4) - 1.5) * 0.38, Math.floor(i / 4) * 0.32 + 0.18, 0);
        bundle.castShadow = true;
        group.add(bundle);
      }
    }

    return group;
  }

  // ==========================================
  // FARMING IMPLEMENTS (CULTIVATOR, PLOUGH, DRILL)
  // ==========================================

  createImplement(type = 'cultivator') {
    const THREE = this.THREE;
    const root = new THREE.Group();

    // 3-point mounting A-frame
    const aFrameGroup = new THREE.Group();
    const beamGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.1, 8);
    const leftArm = new THREE.Mesh(beamGeo, this.materials.implementSteel);
    leftArm.position.set(-0.35, 0.45, 0.2);
    leftArm.rotation.z = -0.3;
    const rightArm = leftArm.clone();
    rightArm.position.x = 0.35;
    rightArm.rotation.z = 0.3;
    const topPinGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.15, 8);
    const topPin = new THREE.Mesh(topPinGeo, this.materials.chrome);
    topPin.position.set(0, 0.9, 0.2);
    topPin.rotation.x = Math.PI / 2;
    aFrameGroup.add(leftArm, rightArm, topPin);
    root.add(aFrameGroup);

    if (type === 'cultivator') {
      // 9-Tine Spring Loaded Cultivator (Tilla)
      const frameGeo = new THREE.BoxGeometry(2.1, 0.1, 0.6);
      const frame = new THREE.Mesh(frameGeo, this.materials.implementSteel);
      frame.position.set(0, 0.15, -0.2);
      frame.castShadow = true;
      root.add(frame);

      // Curved steel tines with shovel duckfoot points
      const tineCurveGeo = new THREE.TorusGeometry(0.28, 0.035, 8, 12, Math.PI * 0.65);
      tineCurveGeo.rotateY(Math.PI / 2);
      const tineCount = 9;
      for (let i = 0; i < tineCount; i++) {
        const x = ((i / (tineCount - 1)) - 0.5) * 1.95;
        const z = (i % 2 === 0 ? -0.1 : -0.35);
        const tine = new THREE.Mesh(tineCurveGeo, this.materials.implementSteel);
        tine.position.set(x, 0.1, z);
        tine.castShadow = true;
        root.add(tine);
      }
    } else if (type === 'plough') {
      // 3-Bottom Mouldboard Reversible Plough (Hal)
      const beamGeo = new THREE.BoxGeometry(0.15, 0.15, 1.8);
      beamGeo.rotateY(0.35);
      const beam = new THREE.Mesh(beamGeo, this.materials.implementSteel);
      beam.position.set(0, 0.2, -0.4);
      beam.castShadow = true;
      root.add(beam);

      for (let i = 0; i < 3; i++) {
        const shareGeo = new THREE.ConeGeometry(0.25, 0.6, 6);
        shareGeo.rotateZ(Math.PI / 3);
        const share = new THREE.Mesh(shareGeo, this.materials.chrome);
        share.position.set((i - 1) * 0.45, 0.0, -i * 0.55);
        share.castShadow = true;
        root.add(share);
      }
    } else if (type === 'seed_drill') {
      // Seed Drill Box + Dispenser tubes
      const boxGeo = new THREE.BoxGeometry(2.0, 0.5, 0.5);
      const boxMat = new THREE.MeshStandardMaterial({ color: 0x0277bd, roughness: 0.5 });
      const box = new THREE.Mesh(boxGeo, boxMat);
      box.position.set(0, 0.5, -0.25);
      box.castShadow = true;
      root.add(box);

      // 7 Seed dropper tubes
      for (let i = 0; i < 7; i++) {
        const tubeGeo = new THREE.CylinderGeometry(0.02, 0.03, 0.6, 8);
        const tube = new THREE.Mesh(tubeGeo, this.materials.rubber);
        tube.position.set(((i / 6) - 0.5) * 1.8, 0.15, -0.25);
        tube.castShadow = true;
        root.add(tube);
      }
    }

    return {
      root,
      type
    };
  }
}


  // ==========================================
  // MODULE: world.js
  // ==========================================
/**
 * Indian Tractor Simulator 3D - Open-World Indian Village Environment
 * Generates an explorable rural Indian landscape with paved & dirt roads,
 * interactive agricultural fields with soil state tracking, farmhouses,
 * canal bridge, tubewell water pump, and Kisan Mandi market.
 */

class WorldManager {
  constructor(THREE) {
    this.THREE = THREE;
    this.root = new THREE.Group();

    // Terrain parameters
    this.worldSize = 560;

    // Interactive Agricultural Field States
    // Field 1: Wheat Field (90m x 70m)
    this.field1 = {
      centerX: -75,
      centerZ: 85,
      width: 90,
      depth: 70,
      gridCols: 14,
      gridRows: 10,
      patches: [], // 0: Raw stubble, 1: Cultivated/ploughed, 2: Seeded, 3: Golden ripe
      meshGroup: new THREE.Group(),
      cropMeshes: []
    };

    // Field 2: Mustard Field (Yellow flowers)
    this.field2 = {
      centerX: 85,
      centerZ: 95,
      width: 85,
      depth: 65,
      meshGroup: new THREE.Group()
    };

    // Field 3: Sugarcane Field (Tall green stalks)
    this.field3 = {
      centerX: 95,
      centerZ: -85,
      width: 105,
      depth: 75,
      meshGroup: new THREE.Group()
    };

    // Landmark Locations for Missions & GPS Minimap
    this.waypoints = {
      farm_shed: { x: -20, z: -25, name: 'Farm Yard Shed', color: 0x4caf50 },
      farmer_house: { x: -45, z: -55, name: 'Village Elder House', color: 0x2196f3 },
      kisan_mandi: { x: -140, z: -120, name: 'Kisan Mandi (Grain Market)', color: 0xff9800 },
      canal_bridge: { x: -80, z: -20, name: 'Canal Bridge', color: 0x00bcd4 },
      tubewell_pump: { x: 35, z: 25, name: 'Tubewell Boring Pump', color: 0x00e676 },
      mud_trail: { x: 40, z: -120, name: 'Muddy Trail', color: 0x795548 },
      field1: { x: -75, z: 85, name: 'Wheat Field #1', color: 0xffeb3b },
      field2: { x: 85, z: 95, name: 'Mustard Field #2', color: 0xffd600 },
      field3: { x: 95, z: -85, name: 'Sugarcane Field #3', color: 0x8bc34a }
    };

    // Streetlights for night illumination
    this.streetlights = [];
  }

  // ==========================================
  // TERRAIN HEIGHTMAP & SURFACE PROFILER
  // ==========================================

  getTerrainHeight(x, z) {
    // Canal ditch cut-out
    if (x > -92 && x < -68 && Math.abs(z + 20) > 8) {
      // Deep canal channel except at the bridge (z approx -20)
      return -2.4;
    }

    // Gentle rural rolling topography
    const wave1 = Math.sin(x * 0.015) * Math.cos(z * 0.015) * 1.5;
    const wave2 = Math.sin(x * 0.035 + 1.2) * Math.cos(z * 0.032) * 0.6;

    // Flatten village center, fields, and mandi
    const distFromCenter = Math.hypot(x, z);
    if (distFromCenter < 60) return 0.0; // village center flat
    if (Math.hypot(x - (-75), z - 85) < 55) return 0.2; // Field 1 flat
    if (Math.hypot(x - 85, z - 95) < 50) return 0.15; // Field 2 flat
    if (Math.hypot(x - (-140), z - (-120)) < 40) return 0.0; // Mandi flat

    return Math.max(-0.5, wave1 + wave2);
  }

  getSurfaceType(x, z) {
    // 1. Paved Village Road Bypass (Main road)
    if ((Math.abs(x) < 4.5 && z > -160 && z < 160) || (Math.abs(z + 20) < 4.5 && x > -160 && x < 160)) {
      return 'road';
    }

    // 2. Muddy Trail (Southern off-road section)
    if (x > 15 && x < 75 && z < -90 && z > -150) {
      return 'mud';
    }

    // 3. Agricultural Fields
    if (Math.abs(x - this.field1.centerX) < this.field1.width * 0.5 &&
        Math.abs(z - this.field1.centerZ) < this.field1.depth * 0.5) {
      return 'field';
    }
    if (Math.abs(x - this.field2.centerX) < this.field2.width * 0.5 &&
        Math.abs(z - this.field2.centerZ) < this.field2.depth * 0.5) {
      return 'field';
    }
    if (Math.abs(x - this.field3.centerX) < this.field3.width * 0.5 &&
        Math.abs(z - this.field3.centerZ) < this.field3.depth * 0.5) {
      return 'field';
    }

    // 4. Dirt tracks connecting farm sheds and fields
    if (Math.hypot(x - (-20), z - (-25)) < 30 || Math.hypot(x - 35, z - 25) < 25) {
      return 'dirt';
    }

    return 'grass';
  }

  // ==========================================
  // BUILD WORLD SCENERY
  // ==========================================

  build() {
    const THREE = this.THREE;

    // 1. Base Terrain Mesh
    const terrainGeo = new THREE.PlaneGeometry(this.worldSize, this.worldSize, 64, 64);
    terrainGeo.rotateX(-Math.PI / 2);

    const pos = terrainGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const vx = pos.getX(i);
      const vz = pos.getZ(i);
      pos.setY(i, this.getTerrainHeight(vx, vz));
    }
    terrainGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshStandardMaterial({
      color: 0x5a7e32, // Lush rural Indian green
      roughness: 0.9,
      metalness: 0.05
    });

    const terrain = new THREE.Mesh(terrainGeo, terrainMat);
    terrain.receiveShadow = true;
    this.root.add(terrain);

    // 2. Road Network
    this.buildRoads();

    // 3. Canal & Arched Bridge
    this.buildCanalAndBridge();

    // 4. Agricultural Fields
    this.buildFields();

    // 5. Village Farmhouses & Brick Buildings
    this.buildVillageStructures();

    // 6. Tubewell Water Pump & Flowing Pond
    this.buildTubewellPump();

    // 7. Kisan Mandi (Grain Market)
    this.buildKisanMandi();

    // 8. Trees, Foliage & Boundary Walls
    this.buildVegetationAndProps();

    return this.root;
  }

  buildRoads() {
    const THREE = this.THREE;
    const roadMat = new THREE.MeshStandardMaterial({
      color: 0x333333, // Paved asphalt
      roughness: 0.85
    });
    const roadLineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    // North-South Main Village Highway (width 8m, length 320m)
    const nsRoadGeo = new THREE.PlaneGeometry(8, 320);
    nsRoadGeo.rotateX(-Math.PI / 2);
    const nsRoad = new THREE.Mesh(nsRoadGeo, roadMat);

  buildFields() {
    const THREE = this.THREE;

    // ==========================================
    // FIELD 1: INTERACTIVE WHEAT FIELD (SOIL GRID)
    // ==========================================
    const f1 = this.field1;
    const soilBaseGeo = new THREE.PlaneGeometry(f1.width, f1.depth);
    soilBaseGeo.rotateX(-Math.PI / 2);
    const stubbleMat = new THREE.MeshStandardMaterial({ color: 0x795548, roughness: 0.95 });
    const f1Base = new THREE.Mesh(soilBaseGeo, stubbleMat);
    f1Base.position.set(f1.centerX, 0.05, f1.centerZ);
    f1Base.receiveShadow = true;
    this.root.add(f1Base);

    // Soil Grid Patches
    const patchW = f1.width / f1.gridCols;
    const patchD = f1.depth / f1.gridRows;
    const ploughedMat = new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: 0.95 }); // Rich dark furrowed soil
    const wheatCropMat = new THREE.MeshStandardMaterial({ color: 0xd4a017, roughness: 0.8 }); // Golden ripe wheat

    f1.meshGroup.position.set(f1.centerX, 0.06, f1.centerZ);

    for (let r = 0; r < f1.gridRows; r++) {
      for (let c = 0; c < f1.gridCols; c++) {
        const px = (c - f1.gridCols * 0.5 + 0.5) * patchW;
        const pz = (r - f1.gridRows * 0.5 + 0.5) * patchD;

        const patchGeo = new THREE.PlaneGeometry(patchW * 0.96, patchD * 0.96);
        patchGeo.rotateX(-Math.PI / 2);
        const patchMesh = new THREE.Mesh(patchGeo, stubbleMat);
        patchMesh.position.set(px, 0, pz);
        f1.meshGroup.add(patchMesh);

        // Wheat Crop cluster (hidden until sown/grown)
        const cropCluster = new THREE.Group();
        cropCluster.position.set(px, 0, pz);
        const stalkGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.75, 5);
        for (let i = 0; i < 5; i++) {
          const stalk = new THREE.Mesh(stalkGeo, wheatCropMat);
          stalk.position.set((Math.random() - 0.5) * patchW * 0.6, 0.38, (Math.random() - 0.5) * patchD * 0.6);
          stalk.rotation.z = (Math.random() - 0.5) * 0.2;
          cropCluster.add(stalk);
        }
        cropCluster.visible = false;
        f1.meshGroup.add(cropCluster);

        f1.patches.push({
          col: c,
          row: r,
          worldX: f1.centerX + px,
          worldZ: f1.centerZ + pz,
          state: 0, // 0: Raw stubble, 1: Cultivated, 2: Seeded, 3: Golden Ripe
          mesh: patchMesh,
          cropMesh: cropCluster,
          ploughedMat,
          stubbleMat
        });
      }
    }
    this.root.add(f1.meshGroup);

    // ==========================================
    // FIELD 2: MUSTARD FIELD (SARSON KE KHET)
    // ==========================================
    const f2 = this.field2;
    const f2SoilGeo = new THREE.PlaneGeometry(f2.width, f2.depth);
    f2SoilGeo.rotateX(-Math.PI / 2);
    const f2Soil = new THREE.Mesh(f2SoilGeo, ploughedMat);
    f2Soil.position.set(f2.centerX, 0.05, f2.centerZ);
    this.root.add(f2Soil);

    // Dense bright yellow mustard flower clusters
    const mustardMat = new THREE.MeshStandardMaterial({ color: 0xffeb3b, roughness: 0.7 });
    const flowerGeo = new THREE.DodecahedronGeometry(0.35, 0);
    const mustardCluster = new THREE.Group();
    mustardCluster.position.set(f2.centerX, 0.4, f2.centerZ);

    for (let i = 0; i < 90; i++) {
      const flower = new THREE.Mesh(flowerGeo, mustardMat);
      flower.position.set((Math.random() - 0.5) * (f2.width - 4), (Math.random() * 0.4), (Math.random() - 0.5) * (f2.depth - 4));
      mustardCluster.add(flower);
    }
    this.root.add(mustardCluster);

    // ==========================================
    // FIELD 3: SUGARCANE FIELD (GANNA)
    // ==========================================
    const f3 = this.field3;
    const f3SoilGeo = new THREE.PlaneGeometry(f3.width, f3.depth);
    f3SoilGeo.rotateX(-Math.PI / 2);
    const f3Soil = new THREE.Mesh(f3SoilGeo, ploughedMat);
    f3Soil.position.set(f3.centerX, 0.05, f3.centerZ);
    this.root.add(f3Soil);

    const caneMat = new THREE.MeshStandardMaterial({ color: 0x33691e, roughness: 0.6 });
    const caneGeo = new THREE.CylinderGeometry(0.12, 0.14, 2.8, 6);
    const caneGroup = new THREE.Group();
    caneGroup.position.set(f3.centerX, 1.4, f3.centerZ);

    for (let i = 0; i < 110; i++) {
      const cane = new THREE.Mesh(caneGeo, caneMat);
      cane.position.set((Math.random() - 0.5) * (f3.width - 6), 0, (Math.random() - 0.5) * (f3.depth - 6));
      cane.rotation.z = (Math.random() - 0.5) * 0.15;
      caneGroup.add(cane);
    }
    this.root.add(caneGroup);
  }

  updateSoilCultivation(toolWorldX, toolWorldZ, toolRadius = 2.4, isPloughing = true) {
    let cultivatedCount = 0;
    const total = this.field1.patches.length;

    for (const patch of this.field1.patches) {
      const dist = Math.hypot(toolWorldX - patch.worldX, toolWorldZ - patch.worldZ);
      if (dist < toolRadius) {
        if (isPloughing && patch.state === 0) {
          patch.state = 1;
          patch.mesh.material = patch.ploughedMat;
        } else if (!isPloughing && patch.state === 1) {
          // Sowing seeds
          patch.state = 2;
          patch.cropMesh.visible = true;
        }
      }
      if (patch.state >= 1) cultivatedCount++;
    }

    return (cultivatedCount / total) * 100; // Percentage cultivated
  }
